[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-reference"
version = "0.2.0"
description = "Reference runtime and diagnostic CLI for the Agent Memory project"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "jsonschema>=4.20,<5",
  "cryptography>=50,<51",
  "rfc8785>=0.1,<0.2",
]

[project.optional-dependencies]
comparators = [
  "agent-manifest==0.12.0",
  "agentrust-trace==0.10.0",
]
# #669 pinned local representation provider (decision-embedding-dependency).
# Numerics-determining packages are exact; numpy's exact pin lives in
# reference/requirements-semantic.txt and is bound into the representation config_digest.
semantic = [
  "onnxruntime==1.30.0",
  "tokenizers==0.23.2",
  "numpy>=1.26,<3",
]

[project.scripts]
agent-memory = "agentmem_ref.console:main"

[tool.setuptools]
package-dir = {"" = "reference"}

[tool.setuptools.packages.find]
where = ["reference"]
include = ["agentmem_ref*"]

[tool.setuptools.package-data]
agentmem_ref = ["_schemas/*.json", "_profiles/*.json"]
