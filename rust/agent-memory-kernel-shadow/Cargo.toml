[package]
name = "agent-memory-kernel-shadow"
version = "0.1.0"
edition = "2024"
publish = false
description = "Evidence-only Rust shadow kernel for Agent Memory cross-language qualification"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_json_canonicalizer = "=0.3.2"
