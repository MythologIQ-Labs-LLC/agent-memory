<svg xmlns="http://www.w3.org/2000/svg" width="540" height="940" viewBox="0 0 540 940" role="img" aria-labelledby="title desc">
  <title id="title">Portable Agent Memory governance evidence chain</title>
  <desc id="desc">An evidence-scoped vertical diagram showing a canonical Agent Memory decision receipt producing a content-free signed portable evidence projection, correlation to runtime and external action evidence, and independent verification across evidence integrity, Agent Memory governance disposition, runtime execution, and lifecycle satisfaction. The diagram reflects executable P4.5 evidence toward proposed ADR-021 and does not accept the ADR or make external evidence authoritative for Agent Memory semantics.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8b949e"/></marker></defs>
  <rect x="1" y="1" width="538" height="938" rx="18" fill="#0d1117" stroke="#30363d"/>
  <text x="28" y="40" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="23" font-weight="700">Portable evidence proves relationships, not permission</text>
  <text x="28" y="65" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">Executable P4.5 evidence toward ADR-021 · ADR-021 remains Proposed</text>

  <text x="28" y="105" fill="#79c0ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">01  SEMANTIC DECISION REMAINS CANONICAL</text>
  <rect x="28" y="120" width="484" height="104" rx="12" fill="#161b22" stroke="#388bfd"/>
  <text x="270" y="150" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700">Canonical Agent Memory decision receipt</text>
  <text x="270" y="176" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">PAMA disposition · policy/state refs · lifecycle result · provenance</text>
  <text x="270" y="200" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">Agent Memory owns what the memory consequence means and whether it is permissible.</text>

  <line x1="270" y1="224" x2="270" y2="252" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="28" y="284" fill="#d2a8ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">02  CONTENT-FREE PORTABLE PROJECTION</text>
  <rect x="28" y="299" width="484" height="132" rx="12" fill="#1c1628" stroke="#a371f7"/>
  <text x="270" y="329" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700">Signed portable governance evidence v1</text>
  <text x="270" y="355" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">receipt hash · action_ref · policy/authority refs · disposition · lifecycle result</text>
  <text x="270" y="379" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">opaque scope/domain refs where applicable · Ed25519 issuer/key binding</text>
  <text x="270" y="405" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">No raw memory · no hidden reasoning · not a second canonical receipt</text>

  <line x1="270" y1="431" x2="270" y2="459" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="28" y="491" fill="#7ee787" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">03  CORRELATE TO EXECUTION / EXTERNAL EVIDENCE</text>
  <rect x="28" y="506" width="484" height="112" rx="12" fill="#122019" stroke="#3fb950"/>
  <text x="270" y="536" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700">Runtime action + Agent Manifest / TRACE-cMCP evidence</text>
  <text x="270" y="562" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">correlate action/checkpoint/external receipt to Agent Memory evidence</text>
  <text x="270" y="588" text-anchor="middle" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">External systems verify binding/integrity. They do not implement PAMA semantics.</text>

  <line x1="270" y1="618" x2="270" y2="646" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="28" y="678" fill="#ffa657" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">04  VERIFY FOUR OUTCOMES SEPARATELY</text>
  <rect x="28" y="693" width="484" height="170" rx="12" fill="#201a12" stroke="#d29922"/>
  <text x="48" y="723" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700">A. Evidence integrity / binding</text>
  <text x="48" y="753" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700">B. Agent Memory governance disposition</text>
  <text x="48" y="783" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700">C. Runtime execution outcome</text>
  <text x="48" y="813" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700">D. Lifecycle-obligation satisfaction</text>
  <text x="48" y="843" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">A valid negative outcome is evidence. Do not flatten these dimensions to one “valid” bit.</text>

  <rect x="28" y="885" width="484" height="36" rx="9" fill="#251719" stroke="#f85149"/>
  <text x="270" y="908" text-anchor="middle" fill="#ff7b72" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700">valid signature != permission · valid execution != authorization · valid DEL != forgetting</text>
</svg>
