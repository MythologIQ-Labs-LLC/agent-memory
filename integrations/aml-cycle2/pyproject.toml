[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-aml"
version = "0.1.0"
description = "Agent Memory served through the Agent Memory Leaderboard Cycle 2 Add/Search contract"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "MythologIQ Labs LLC"}]
# The Agent Memory runtime is this repository's own package (agent-memory-reference, repository root).
dependencies = ["agent-memory-reference"]

[project.scripts]
agent-memory-aml = "aml_agent_memory.server:main"
agent-memory-aml-smoke = "aml_agent_memory.smoke:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
