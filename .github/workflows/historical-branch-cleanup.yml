name: Historical Branch Cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-audited-historical-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete only audited historical branch refs
