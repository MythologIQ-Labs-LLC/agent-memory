name: Canonical JSON v2 Migration Preflight

on:
  pull_request:
    paths:
      - "reference/canonical_json_v2_migration_preflight.py"
      - "reference/tests/test_canonical_json_v2_migration_preflight.py"
      - ".github/workflows/canonical-json-v2-migration-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Execute side-effect-free candidate commitment preflight
        run: python -m unittest reference.tests.test_canonical_json_v2_migration_preflight
