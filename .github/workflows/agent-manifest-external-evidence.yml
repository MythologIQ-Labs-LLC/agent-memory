name: Agent Manifest External Evidence Comparator

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent-manifest-external-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install core reference dependencies
        run: python -m pip install --disable-pip-version-check -r reference/requirements.txt

      - name: Execute dependency-free adapter regressions
        env:
          PYTHONPATH: reference
        run: python -m unittest tests.test_agent_manifest_external_evidence

      - name: Install exact released Agent Manifest environment
        run: |
          python -m venv /tmp/agent-memory-agent-manifest
          /tmp/agent-memory-agent-manifest/bin/python -m pip install --disable-pip-version-check \
            -r reference/requirements.txt
          /tmp/agent-memory-agent-manifest/bin/python - <<'PY'
          import importlib.metadata
          actual = importlib.metadata.version("agent-manifest")
          assert actual == "0.11.0", actual
          print(f"agent-manifest=={actual}")
          PY

      - name: Execute real released Agent Manifest comparator
        env:
          AGENT_MEMORY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          PYTHONPATH=reference
          /tmp/agent-memory-agent-manifest/bin/python
          reference/run_agent_manifest_external_evidence_comparator.py
          --agent-memory-commit "$AGENT_MEMORY_COMMIT"
          --output agent-manifest-external-evidence.json

      - name: Upload Agent Manifest comparator evidence
        uses: actions/upload-artifact@v7
        with:
          name: agent-manifest-external-evidence-comparator
          path: agent-manifest-external-evidence.json
          if-no-files-found: error
