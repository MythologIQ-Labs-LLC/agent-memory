name: LongMemEval Same-Harness Lane Run

# Manual, deliberate execution of one row of a frozen LongMemEval same-harness lane
# (#640): one workflow dispatch per (lane, row, plane). The lane is an input; an accepted
# lane refuses to run because only a frozen lane executes.
# Every run re-verifies the lane file, the evaluator and adapter blobs the lane binds,
# the frozen input digest, and (for the Mem0 row) the exact release and extras posture
# before a single question is scored. Raw reports are retained as artifacts; a row
# becomes evidence only after review and import, never from this workflow directly.
#
# #662 Phase 0 note: this is a manual_exception evidence lane with its own inputs and
# artifact contract. It cannot ride the PR-triggered LongMemEval replay job without
# changing that job's contract, and the AMB workflow is bound to the AMB harness checkout.

on:
  workflow_dispatch:
    inputs:
      lane_id:
        description: "Frozen lane to execute (an accepted lane is refused)"
        required: true
        default: "longmemeval-s-retrieval-parity-v3"
        type: choice
        options:
          - longmemeval-s-retrieval-parity-v1
          - longmemeval-s-retrieval-parity-v2
          - longmemeval-s-retrieval-parity-v3
      backend:
        description: "Lane row to execute"
        required: true
        default: "agent_memory"
        type: choice
        options:
          - agent_memory
          - agent_memory_semantic
          - lexical_overlap
          - mem0_explicit
      granularity:
        description: "Retrieval plane"
        required: true
        default: "session"
        type: choice
        options:
          - session
          - turn
      subset_size:
        description: "0 runs the full frozen selection (the only acceptable row); any other value is a bounded smoke that can never be accepted"
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: longmemeval-lane-${{ github.ref }}-${{ inputs.lane_id }}-${{ inputs.backend }}-${{ inputs.granularity }}-${{ inputs.subset_size }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    # Measured: the Agent Memory turn plane takes ~15 minutes on this runner class; the Mem0
    # row ingests ~122k turn items at ~10 ms each locally. The agent_memory_semantic row
    # (#669) embeds every item through the pinned ONNX provider: ~80 minutes expected on the
    # session plane, ~2 hours on a slower runner, so 240 minutes bounds it with headroom.
    timeout-minutes: 240
    env:
      LANE_FILE: reference/agentmem_ref/evaluation/lanes/${{ inputs.lane_id }}.json
      MEM0_PINS: "mem0ai==2.2.1 qdrant-client==1.17.0 sentence-transformers==5.2.3 torch==2.10.0"
      MEM0_TELEMETRY: "false"
      HF_HOME: /tmp/lme-hf-home
      AGENT_MEMORY_REPRESENTATION_DIR: ${{ github.workspace }}/.representation/multi-qa-MiniLM-L6-cos-v1-b207367
      PYTHONPATH: reference
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          # full history: the Runtime Baseline checker diffs against the frozen revision
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Agent Memory reference
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e . -r reference/requirements.txt

      - name: Record the Runtime Baseline posture of this checkout
        shell: bash
        run: |
          set -euo pipefail
          line="$(python scripts/check_runtime_baseline_equivalence.py --candidate HEAD)"
          echo "$line"
          state="$(echo "$line" | grep -oE 'equivalence: [A-Z]+' | head -n1 | cut -d' ' -f2)"
          declaration="$(python - <<'PY'
          import json, subprocess
          from pathlib import Path
          register = json.loads(Path("reports/runtime/baseline-register.json").read_text(encoding="utf-8"))
          declared = register.get("declared_successor")
          print("" if declared is None else subprocess.run(["git", "hash-object", declared["declaration"]], capture_output=True, text=True, check=True).stdout.strip())
          PY
          )"
          {
            echo "RUNTIME_BASELINE_STATE=$state"
            echo "RUNTIME_BASELINE_LINE=$line"
            echo "DECLARATION_BLOB=$declaration"
          } >> "$GITHUB_ENV"

      - name: Install the semantic extra under its pinned constraints (agent_memory_semantic row only)
        if: ${{ inputs.backend == 'agent_memory_semantic' }}
        run: python -m pip install --disable-pip-version-check -e '.[semantic]' -c reference/requirements-semantic.txt

      - name: Restore the pinned representation model (agent_memory_semantic row only)
        if: ${{ inputs.backend == 'agent_memory_semantic' }}
        uses: actions/cache@v6
        with:
          path: .representation
          key: semantic-minilm-b207367-${{ hashFiles('reference/agentmem_ref/runtime/representation_onnx.py') }}

      - name: Fetch and verify the pinned representation model by digest (agent_memory_semantic row only)
        if: ${{ inputs.backend == 'agent_memory_semantic' }}
        run: python -m agentmem_ref.runtime.representation_onnx fetch

      - name: Install the frozen Mem0 OSS row (exact pins, base package, no extras)
        if: ${{ inputs.backend == 'mem0_explicit' }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          python -m pip install --disable-pip-version-check $MEM0_PINS
          python - <<'PY'
          import json
          from longmemeval_mem0_explicit_bridge import verify_install_posture
          print(json.dumps(verify_install_posture()))
          PY

      - name: Verify the frozen lane and the evaluator/adapter blobs it binds
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          agent-memory benchmark validate-lane "$LANE_FILE" --json | tee "$RUNNER_TEMP/lane-validation.json"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          lane = json.loads(Path(os.environ["LANE_FILE"]).read_text(encoding="utf-8"))
          assert lane["status"] == "frozen", lane["status"]
          assert lane["lane_id"] == "${{ inputs.lane_id }}"
          backend = "${{ inputs.backend }}"
          row = next((item for item in lane["systems"] if item["provider_key"] == backend), None)
          assert row is not None, f"lane {lane['lane_id']} has no {backend} row"
          assert row["status"] == "frozen", (backend, row["status"], row.get("status_reason"))
          for path, blob in lane["harness"]["source_blobs"].items():
              if not path.startswith("reference/"):
                  continue  # upstream LongMemEval files are bound by the upstream revision
              actual = subprocess.run(["git", "hash-object", path], capture_output=True, text=True, check=True).stdout.strip()
              assert actual == blob, (path, actual, blob)
              print(f"{path} blob {actual}: frozen")
          PY

      - name: Acquire the frozen LongMemEval_S input
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          lane = json.loads(Path(os.environ["LANE_FILE"]).read_text(encoding="utf-8"))
          (fixture,) = lane["dataset"]["fixtures"]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"LME_INPUT_URL={fixture['url']}\n")
              handle.write(f"LME_INPUT_SHA256={fixture['sha256']}\n")
          assert fixture["sha256"] == lane["dataset"]["input_sha256"]
          PY
      - name: Download and digest-check the input
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/longmemeval_s_cleaned.json "$LME_INPUT_URL"
          actual="$(sha256sum /tmp/longmemeval_s_cleaned.json | awk '{print $1}')"
          test "$actual" = "$LME_INPUT_SHA256"
          echo "input sha256 $actual: frozen"

      - name: Run the lane row
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lme-output"
          args=(
            --input /tmp/longmemeval_s_cleaned.json
            --corpus-class external_frozen
            --granularity "${{ inputs.granularity }}"
            --output "$RUNNER_TEMP/lme-output/${{ inputs.granularity }}-${{ inputs.backend }}.json"
          )
          # A row may run a built-in backend under its own identity (#669 D2): the row's
          # configuration.backend names the runner backend, and its semantic_retrieval mode
          # (absent: off) is read from the selected row, never from the dispatcher.
          row_posture="$(python - <<'PY'
          import json, os
          from pathlib import Path
          lane = json.loads(Path(os.environ["LANE_FILE"]).read_text(encoding="utf-8"))
          row = next(item for item in lane["systems"] if item["provider_key"] == "${{ inputs.backend }}")
          configuration = row.get("configuration") or {}
          print(configuration.get("backend", row["provider_key"]), configuration.get("semantic_retrieval", "off"))
          PY
          )"
          read -r runner_backend semantic <<< "$row_posture"
          args+=(--backend "$runner_backend")
          if [ "$semantic" != "off" ]; then
            args+=(--agent-memory-semantic-retrieval "$semantic")
          fi
          echo "RUNNER_BACKEND=$runner_backend" >> "$GITHUB_ENV"
          if [ "${{ inputs.backend }}" = "mem0_explicit" ]; then
            args+=(--external-backend longmemeval_mem0_explicit_bridge:install_longmemeval_mem0_explicit_backend)
          fi
          # The lane's control row decides the Agent Memory return budget (contract 1.4.0), never the dispatcher.
          budget="$(python - <<'PY'
          import json, os
          from pathlib import Path
          lane = json.loads(Path(os.environ["LANE_FILE"]).read_text(encoding="utf-8"))
          control = next(item for item in lane["systems"] if item["role"] == "control")
          print(str((control.get("configuration") or {}).get("budget", "none")))
          PY
          )"
          args+=(--agent-memory-budget "$budget")
          if [ "${{ inputs.subset_size }}" != "0" ]; then
            args+=(--subset-size "${{ inputs.subset_size }}")
          fi
          python reference/run_longmemeval.py "${args[@]}"

      - name: Record execution identity
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lme-output"
          [ -f "$RUNNER_TEMP/lane-validation.json" ] && cp "$RUNNER_TEMP/lane-validation.json" "$RUNNER_TEMP/lme-output/" || true
          python - <<'PY'
          import importlib.metadata as md
          import importlib.util
          import json
          import os
          import subprocess
          from pathlib import Path

          def version(name):
              try:
                  return md.version(name)
              except md.PackageNotFoundError:
                  return None

          def blob(path):
              return subprocess.run(["git", "hash-object", path], capture_output=True, text=True, check=True).stdout.strip()

          lane_file = os.environ["LANE_FILE"]
          lane = json.loads(Path(lane_file).read_text(encoding="utf-8"))
          validation_path = Path(os.environ["RUNNER_TEMP"], "lane-validation.json")
          validation = json.loads(validation_path.read_text(encoding="utf-8")) if validation_path.is_file() else None
          identity = {
              "evidence_class": "same_harness_external_candidate",
              "agent_memory_revision": os.environ["GITHUB_SHA"],
              "lane_id": lane["lane_id"],
              "lane_file": lane_file,
              "lane_digest_sha256": None if validation is None else validation.get("lane_digest_sha256"),
              "upstream_revision": lane["harness"]["revision"],
              "backend": "${{ inputs.backend }}",
              "runner_backend": os.environ.get("RUNNER_BACKEND") or "${{ inputs.backend }}",
              "granularity": "${{ inputs.granularity }}",
              "subset_size": "${{ inputs.subset_size }}",
              "full_selection": "${{ inputs.subset_size }}" == "0",
              "input_sha256": os.environ.get("LME_INPUT_SHA256"),
              "runtime_baseline_state": os.environ.get("RUNTIME_BASELINE_STATE"),
              "runtime_baseline_line": os.environ.get("RUNTIME_BASELINE_LINE"),
              "declaration_blob": os.environ.get("DECLARATION_BLOB") or None,
              "source_blobs": {
                  path: blob(path) for path in lane["harness"]["source_blobs"] if path.startswith("reference/")
              },
              "resolved_packages": {
                  name: version(name)
                  for name in ("agent-memory-reference", "mem0ai", "qdrant-client", "sentence-transformers", "torch", "openai", "posthog", "numpy", "onnxruntime", "tokenizers")
              },
              "mem0_optional_components": {
                  "fastembed_installed": importlib.util.find_spec("fastembed") is not None,
                  "spacy_installed": importlib.util.find_spec("spacy") is not None,
              },
              "runner": os.environ.get("ImageOS"),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "authority_effect": "none",
          }
          Path(os.environ["RUNNER_TEMP"], "lme-output", "execution-identity.json").write_text(json.dumps(identity, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(identity, indent=2, sort_keys=True))
          PY

      - name: Inventory raw evidence
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/lme-output" && find . -type f -print | sort | tee files.txt && while IFS= read -r file; do sha256sum "$file"; done < files.txt | tee sha256.txt

      - name: Upload raw lane evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: longmemeval-lane-${{ inputs.lane_id }}-${{ inputs.backend }}-${{ inputs.granularity }}-${{ github.sha }}
          path: ${{ runner.temp }}/lme-output/
          if-no-files-found: warn
          retention-days: 30
