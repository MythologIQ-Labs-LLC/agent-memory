name: Canonicalization Reachability

on:
  pull_request:
    paths:
      - "schemas/runtime-configuration.schema.json"
      - "reference/agentmem_ref/runtime/adapter.py"
      - "reference/agentmem_ref/runtime/restart_runtime.py"
      - "reference/agentmem_ref/state/substrate.py"
      - "reference/agentmem_ref/state/sqlite_substrate.py"
      - "reference/qualify_canonical_reachability.py"
      - ".github/workflows/canonical-reachability.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qualify canonical value-domain reachability
        run: |
          mkdir -p "$RUNNER_TEMP/canonical-reachability"
          python reference/qualify_canonical_reachability.py \
            --repo-root . \
            --output "$RUNNER_TEMP/canonical-reachability/reachability.json"

      - name: Upload reachability evidence
        uses: actions/upload-artifact@v4
        with:
          name: canonical-reachability-${{ github.sha }}
          path: ${{ runner.temp }}/canonical-reachability/reachability.json
          if-no-files-found: error
          retention-days: 30
