name: Post-transfer README normalization

on:
  push:
    branches:
      - agent/post-transfer-reconciliation
    paths:
      - .github/workflows/post-transfer-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/post-transfer-reconciliation

      - name: Normalize active README ownership and diagram presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'https://github.com/Knapp-Kevin/agent-memory',
              'https://github.com/MythologIQ-Labs-LLC/agent-memory',
          )

          old = '''<p align="center">
            <img src="assets/agent-memory-flow.svg" alt="Agent Memory governed memory loop: experience becomes evidence and an estimate, PAMA constrains the permitted actions, a consequence is committed with a receipt, retained state is recalled through policy, and memory influences future context." width="100%" />
          </p>'''
          new = '''<p align="center">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="assets/agent-memory-flow.svg">
              <source media="(prefers-color-scheme: light)" srcset="assets/agent-memory-flow-light.svg">
              <img src="assets/agent-memory-flow-light.svg" alt="Agent Memory governed memory loop: experience becomes evidence and an estimate, PAMA constrains the permitted actions, a consequence is committed with a receipt, retained state is recalled through policy, and memory influences future context." width="100%">
            </picture>
          </p>'''
          if old not in text:
              raise SystemExit('Expected README diagram block not found; refusing blind rewrite')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit normalized README
        run: |
          if git diff --quiet -- README.md; then
            echo "README already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Normalize README after organization transfer"
          git push origin HEAD:agent/post-transfer-reconciliation
