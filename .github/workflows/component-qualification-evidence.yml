name: Component Qualification Evidence

on:
  pull_request:
    paths:
      - "schemas/component-capability-qualification.schema.json"
      - "reference/agentmem_ref/qualification.py"
      - "reference/agentmem_ref/code_graph_qualification.py"
      - "reference/run_component_qualification.py"
      - "reference/tests/test_component_qualification.py"
      - "reference/tests/test_code_graph_qualification.py"
      - "reference/fixtures/component-qualification/**"
      - ".github/workflows/component-qualification-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CODEGENOME_COMMIT: d2578729a46d495369bd7613845002d50cf20f4c
  GRAPHIFY_RELEASE: v0.9.43
  GRAPHIFY_COMMIT: 7281f27eac568f77f50910f59f84543458f5dfd1

jobs:
  qualify-code-graph:
    runs-on: ubuntu-latest
    env:
      AGENT_MEMORY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      FIXTURE_ROOT: ${{ github.workspace }}/reference/fixtures/component-qualification
      RAW_ROOT: /tmp/component-qualification-raw
    steps:
      - name: Checkout Agent Memory
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Agent Memory reference dependencies
        run: python -m pip install --disable-pip-version-check -r reference/requirements.txt

      - name: Run qualification unit tests
        env:
          PYTHONPATH: reference
        run: |
          python -m unittest \
            reference/tests/test_component_qualification.py \
            reference/tests/test_code_graph_qualification.py

      - name: Prepare evidence directory
        run: mkdir -p "$RAW_ROOT/codegenome" "$RAW_ROOT/graphify"

      - name: Fetch exact CodeGenome source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/MythologIQ-Labs-LLC/CodeGenome.git /tmp/codegenome
          git -C /tmp/codegenome fetch --depth=1 origin "$CODEGENOME_COMMIT"
          git -C /tmp/codegenome checkout --detach "$CODEGENOME_COMMIT"
          test "$(git -C /tmp/codegenome rev-parse HEAD)" = "$CODEGENOME_COMMIT"
          cp /tmp/codegenome/LICENSE "$RAW_ROOT/codegenome/LICENSE"

      - name: Verify CodeGenome source rights and build CLI
        working-directory: /tmp/codegenome
        run: |
          grep -qi "MIT License" LICENSE
          cargo build -p codegenome-cli

      - name: Execute CodeGenome v1 full build and queries
        run: |
          /tmp/codegenome/target/debug/codegenome index \
            --source-dir "$FIXTURE_ROOT/v1" \
            --store-dir /tmp/codegenome-v1 \
            > "$RAW_ROOT/codegenome/v1-index.txt"

          /tmp/codegenome/target/debug/codegenome query \
            --store-dir /tmp/codegenome-v1 --file main.rs --line 6 \
            --direction downstream --json \
            > "$RAW_ROOT/codegenome/v1-main-downstream.json"
          /tmp/codegenome/target/debug/codegenome query \
            --store-dir /tmp/codegenome-v1 --file main.rs --line 6 \
            --direction upstream --json \
            > "$RAW_ROOT/codegenome/v1-main-upstream.json"
          /tmp/codegenome/target/debug/codegenome query \
            --store-dir /tmp/codegenome-v1 --file decoy.rs --line 6 \
            --direction downstream --json \
            > "$RAW_ROOT/codegenome/v1-decoy-downstream.json"

      - name: Execute CodeGenome v2 full rebuild and queries
        run: |
          /tmp/codegenome/target/debug/codegenome index \
            --source-dir "$FIXTURE_ROOT/v2" \
            --store-dir /tmp/codegenome-v2 \
            > "$RAW_ROOT/codegenome/v2-index.txt"

          /tmp/codegenome/target/debug/codegenome query \
            --store-dir /tmp/codegenome-v2 --file main.rs --line 6 \
            --direction downstream --json \
            > "$RAW_ROOT/codegenome/v2-main-downstream.json"
          /tmp/codegenome/target/debug/codegenome query \
            --store-dir /tmp/codegenome-v2 --file main.rs --line 6 \
            --direction upstream --json \
            > "$RAW_ROOT/codegenome/v2-main-upstream.json"
          /tmp/codegenome/target/debug/codegenome query \
            --store-dir /tmp/codegenome-v2 --file decoy.rs --line 6 \
            --direction downstream --json \
            > "$RAW_ROOT/codegenome/v2-decoy-downstream.json"

      - name: Fetch exact Graphify release source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Graphify-Labs/graphify.git /tmp/graphify
          git -C /tmp/graphify fetch --depth=1 origin "$GRAPHIFY_COMMIT"
          git -C /tmp/graphify checkout --detach "$GRAPHIFY_COMMIT"
          test "$(git -C /tmp/graphify rev-parse HEAD)" = "$GRAPHIFY_COMMIT"
          grep -q 'version = "0.9.43"' /tmp/graphify/pyproject.toml
          grep -q 'license = "Apache-2.0"' /tmp/graphify/pyproject.toml
          grep -q "Apache License" /tmp/graphify/LICENSE
          cp /tmp/graphify/LICENSE "$RAW_ROOT/graphify/LICENSE"
          cp /tmp/graphify/NOTICE "$RAW_ROOT/graphify/NOTICE"

      - name: Install exact Graphify runtime
        run: |
          python -m venv /tmp/graphify-venv
          /tmp/graphify-venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          /tmp/graphify-venv/bin/python -m pip install --disable-pip-version-check -e /tmp/graphify

      - name: Execute Graphify v1 and v2 full builds
        run: |
          /tmp/graphify-venv/bin/graphify extract "$FIXTURE_ROOT/v1" \
            --code-only --out /tmp/graphify-v1
          /tmp/graphify-venv/bin/graphify extract "$FIXTURE_ROOT/v2" \
            --code-only --out /tmp/graphify-v2
          cp /tmp/graphify-v1/graphify-out/graph.json "$RAW_ROOT/graphify/v1-graph.json"
          cp /tmp/graphify-v2/graphify-out/graph.json "$RAW_ROOT/graphify/v2-graph.json"

      - name: Emit exact-head qualification report
        env:
          PYTHONPATH: reference
        run: |
          python reference/run_component_qualification.py \
            --agent-memory-commit "$AGENT_MEMORY_COMMIT" \
            --fixture-root "$FIXTURE_ROOT" \
            --codegenome-v1-main-downstream "$RAW_ROOT/codegenome/v1-main-downstream.json" \
            --codegenome-v1-main-upstream "$RAW_ROOT/codegenome/v1-main-upstream.json" \
            --codegenome-v1-decoy-downstream "$RAW_ROOT/codegenome/v1-decoy-downstream.json" \
            --codegenome-v2-main-downstream "$RAW_ROOT/codegenome/v2-main-downstream.json" \
            --codegenome-v2-main-upstream "$RAW_ROOT/codegenome/v2-main-upstream.json" \
            --codegenome-v2-decoy-downstream "$RAW_ROOT/codegenome/v2-decoy-downstream.json" \
            --graphify-v1 "$RAW_ROOT/graphify/v1-graph.json" \
            --graphify-v2 "$RAW_ROOT/graphify/v2-graph.json" \
            --output "$RAW_ROOT/component-qualification-report.json"

      - name: Verify schema, currentness, maturity, and authority boundaries
        env:
          PYTHONPATH: reference
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import jsonschema

          root = Path(os.environ["RAW_ROOT"])
          report = json.loads((root / "component-qualification-report.json").read_text())
          schema = json.loads(Path("schemas/component-capability-qualification.schema.json").read_text())
          validator = jsonschema.Draft202012Validator(schema)
          assert report["matched_result"]["both_passed"] is True
          assert report["matched_result"]["winner"] is None
          assert report["matched_result"]["authority_effect"] == "none"
          assert report["matched_result"]["unrelated_capabilities_promoted"] == []
          for provider in ("codegenome", "graphify"):
              qualification = report["providers"][provider]["qualification"]
              validator.validate(qualification)
              assert qualification["result"]["earned_maturity"] == "evidence_proven"
              assert qualification["result"]["authority_effect"] == "none"
              assert qualification["result"]["qualification_current"] is True
              assert qualification["source_rights"]["use_posture"] == "runtime_allowed"
          assert report["providers"]["codegenome"]["checks"]["full_rebuild_currentness"] is True
          assert report["providers"]["graphify"]["checks"]["full_rebuild_currentness"] is True
          PY

      - name: Display normalized report
        if: always()
        run: cat "$RAW_ROOT/component-qualification-report.json" || true

      - name: Upload raw and normalized qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-qualification-${{ env.AGENT_MEMORY_COMMIT }}
          path: /tmp/component-qualification-raw
          if-no-files-found: error
