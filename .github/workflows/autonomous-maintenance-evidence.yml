name: Autonomous Maintenance Evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  autonomous-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reference dependencies
        run: python -m pip install --disable-pip-version-check -r reference/requirements.txt

      - name: Execute autonomous-maintenance regressions
        env:
          PYTHONPATH: reference
        run: python -m unittest tests.test_autonomous_maintenance

      - name: Emit autonomous-maintenance evidence
        env:
          AGENT_MEMORY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          PYTHONPATH=reference python reference/run_autonomous_maintenance.py
          --agent-memory-commit "$AGENT_MEMORY_COMMIT"
          --output autonomous-maintenance-evidence.json

      - name: Upload autonomous-maintenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-maintenance-evidence
          path: autonomous-maintenance-evidence.json
          if-no-files-found: error
