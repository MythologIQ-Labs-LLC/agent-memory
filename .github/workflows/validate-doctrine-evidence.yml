name: Validate Doctrine Evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate fixture invariants
        run: python scripts/validate_fixtures.py fixtures

      - name: Validate JSON Schemas, fixtures, and source rights
        run: python scripts/validate_schemas.py

      - name: Validate native doctrine and implementation boundaries
        run: python scripts/validate_doctrine_boundaries.py

      - name: Validate top-level documentation links
        run: >-
          python scripts/validate_markdown_links.py
          README.md
          CONTRIBUTING.md
          docs/README.md
          docs/pama/README.md
          docs/04-governance-and-pama.md
          docs/08-source-material-index.md
          docs/33-pama-decision-table.md
          docs/SOURCE_RIGHTS_POLICY.md
          docs/adr/README.md

      - name: Validate GitHub Wiki source links
        run: python scripts/validate_wiki_links.py wiki-src

      - name: Verify calibration report example is in sync with generator
        run: |
          python scripts/generate_calibration_report.py reports/examples/calibration-results.example.json -o /tmp/calibration-report.md
          diff -u reports/examples/calibration-report.example.md /tmp/calibration-report.md

      - name: Publish validation summary
        if: always()
        run: |
          {
            echo "## Doctrine evidence validation"
            echo ""
            echo "Commands run by this workflow (reproducible locally):"
            echo ""
            echo '```'
            echo "python scripts/validate_fixtures.py fixtures"
            echo "python scripts/validate_schemas.py  # requires: pip install jsonschema"
            echo "python scripts/validate_doctrine_boundaries.py"
            echo "python scripts/validate_markdown_links.py README.md CONTRIBUTING.md docs/README.md docs/pama/README.md docs/04-governance-and-pama.md docs/08-source-material-index.md docs/33-pama-decision-table.md docs/SOURCE_RIGHTS_POLICY.md docs/adr/README.md"
            echo "python scripts/validate_wiki_links.py wiki-src"
            echo "python scripts/generate_calibration_report.py reports/examples/calibration-results.example.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
