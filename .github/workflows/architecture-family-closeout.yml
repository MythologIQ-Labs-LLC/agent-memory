name: Architecture Family Closeout

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  architecture-family-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reference dependencies
        run: python -m pip install --disable-pip-version-check -r reference/requirements.txt

      - name: Run matched architecture-family tests
        env:
          PYTHONPATH: reference
        run: python -m unittest reference/tests/test_architecture_family_closeout.py

      - name: Emit closeout evidence
        env:
          PYTHONPATH: reference
        run: python reference/run_architecture_family_closeout.py --output architecture-family-closeout-evidence.json

      - name: Upload closeout evidence
        uses: actions/upload-artifact@v4
        with:
          name: architecture-family-closeout-evidence
          path: architecture-family-closeout-evidence.json
          if-no-files-found: error
