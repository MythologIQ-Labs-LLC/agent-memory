name: Conditional Memory Influence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r reference/requirements.txt
      - run: python scripts/validate_schemas.py
      - env:
          PYTHONPATH: reference
        run: python -m unittest tests.test_conditional_memory_influence_gate tests.test_conditional_memory_influence_identity tests.test_conditional_memory
