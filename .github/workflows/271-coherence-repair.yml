name: 271 Coherence Repair

on:
  push:
    branches:
      - review/271-coherence
    paths:
      - .github/workflows/271-coherence-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align current public documentation state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text missing in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "wiki-src/Home.md",
              "| **External temporal trust evidence** | #265 is under exact-head validation for signer-trust and transparency evidence. |",
              "| **External temporal trust evidence** | Signer-trust binding, transparency evidence, and the exact OpenSSL RFC 3161 comparator are merged and repository-validated at their declared boundaries. |",
          )

          replace_once(
              "wiki-src/Temporal-Memory-Architecture.md",
              "The #265 evidence layer binds trust to:",
              "The merged external-trust evidence layer binds trust to:",
          )
          replace_once(
              "wiki-src/Temporal-Memory-Architecture.md",
              "The current #265 comparator targets a bounded RFC 3161 claim using the official OpenSSL 3.6.3 release:",
              "The merged external comparator targets a bounded RFC 3161 claim using an exact OpenSSL 3.6.3 source checkout and source-tree fixture:",
          )
          p = Path("wiki-src/Temporal-Memory-Architecture.md")
          text = p.read_text(encoding="utf-8")
          pattern = re.compile(
              r"### #265 under exact-head validation\n\nThe current #265 implementation adds:\n\n(?:- .*\n)+\nThat slice remains evidence-gated until the exact external comparator and full repository validation pass\.\n",
              re.MULTILINE,
          )
          replacement = """### External temporal trust evidence\n\nThe completed #265 / PR #267 slice adds:\n\n- signer trust bound to exact key material;\n- revoked, expired, mismatched, and unverified trust negative paths;\n- provider-neutral inclusion and consistency evidence;\n- explicit non-claims for complete history and global non-equivocation;\n- a real RFC 3161 comparator built from exact OpenSSL 3.6.3 source and exercised against the upstream source-tree fixture.\n\nPR #267 passed the complete 28-workflow matrix at exact final head `3d3483feb10647ce02ed67c9d09b7022406196a6`. The external-evidence artifact is bound to that head with digest `sha256:82ea8c29cbc3637b6e4251d58ac224c0a77749e1b4db5bf544bc087d1df42357`. These are repository evidence claims, not production PKI or universal deployment guarantees.\n"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("expected #265 maturity section missing in Temporal-Memory-Architecture.md")
          p.write_text(text, encoding="utf-8")

          replace_once(
              "wiki-src/Cryptographic-Temporal-Commitments.md",
              "The #265 evidence layer makes signer trust a separate, explicit contract rather than a caller-supplied assumption.",
              "The merged external-trust evidence layer makes signer trust a separate, explicit contract rather than a caller-supplied assumption.",
          )
          replace_once(
              "wiki-src/Cryptographic-Temporal-Commitments.md",
              "The #265 transparency contract also distinguishes two bounded history claims:",
              "The merged transparency contract also distinguishes two bounded history claims:",
          )
          replace_once(
              "wiki-src/Cryptographic-Temporal-Commitments.md",
              "The active #265 evidence slice adds exact signer-trust binding and provider-neutral inclusion/consistency evidence, plus a pinned real RFC 3161 comparator. That slice remains exact-head evidence-gated until its external comparator and repository validation pass.",
              "The completed #265 / PR #267 evidence slice adds exact signer-trust binding and provider-neutral inclusion/consistency evidence plus a real RFC 3161 comparator against exact OpenSSL 3.6.3 source. PR #267 passed the full repository matrix at exact final head `3d3483feb10647ce02ed67c9d09b7022406196a6`; those results remain bounded repository evidence rather than a production trust-service guarantee.",
          )

          replace_once(
              "GOVERNANCE.md",
              "Organization-wide inheritance is tracked separately in #85 and is not claimed merely because Agent Memory has adopted the local policy.",
              "Agent Memory's policy is authoritative only for this repository. Organization-wide contribution-policy inheritance is governed outside this repository and is not implied by local adoption.",
          )
          replace_once(
              "CONTRIBUTING.md",
              "DCO is a planned provenance mechanism, not an invisible current gate. It becomes mandatory only when the repository explicitly activates and enforces it. See the policy and #85 for the organization rollout.",
              "DCO is a planned provenance mechanism, not an invisible current gate. It becomes mandatory only when the repository explicitly activates and enforces it. Agent Memory's local contribution policy does not claim organization-wide rollout authority.",
          )

          replace_once(
              "docs/README.md",
              "| ADR reviewer | [`adr/README.md`](adr/README.md) | ADR-001 through ADR-029 |",
              "| ADR reviewer | [`adr/README.md`](adr/README.md) | ADR-001 through ADR-031 |",
          )
          p = Path("docs/README.md")
          text = p.read_text(encoding="utf-8")
          start = text.index("## Architecture Decision Records")
          end = text.index("## Governance Context Projection")
          new_section = """## Architecture Decision Records\n\nSee [`adr/README.md`](adr/README.md).\n\nThe ADR index is the canonical hand-maintained doctrine-status ledger. This documentation map deliberately does not duplicate the complete status table, because duplicated current-state ledgers drift.\n\nCurrent decision highlights relevant to the documentation map:\n\n- **ADR-020** is Accepted after its explicitly stronger executable governed-uncertainty evidence gate.\n- **ADR-022** is Accepted for logical memory isolation domains and governed boundary crossing.\n- **ADR-024** is Accepted for pre-write coordination of shared durable-memory mutation.\n- **ADR-028** is Accepted and preserves a language-neutral normative core with optional implementation/interoperability profiles.\n- **ADR-030** is Accepted and requires versioned compatibility/currentness before memory-derived projections are treated as current temporal or authorization input.\n- **ADR-031** is Accepted and binds material temporal claims into deterministic commitments while keeping signer trust, external witness evidence, lifecycle currentness, and PAMA authority separate.\n- **ADR-021, ADR-023, ADR-025, ADR-026, ADR-027, and ADR-029** remain Proposed unless and until their individual maturity reviews change the canonical ADR status. Merged implementation evidence does not silently promote doctrine.\n\n"""
          p.write_text(text[:start] + new_section + text[end:], encoding="utf-8")

          replace_once(
              "wiki-src/Governance-Projection.md",
              "ADR-030 and #256 therefore add a compatibility/currentness gate:",
              "Accepted ADR-030 and the merged #256 implementation add a compatibility/currentness gate:",
          )
          p = Path("wiki-src/Governance-Projection.md")
          text = p.read_text(encoding="utf-8")
          start = text.index("## Current maturity")
          end = text.index("## Canonical sources")
          new_section = """## Current maturity\n\nThe base governance-projection architecture remains tracked by **Proposed ADR-029** pending its own stronger maturity review. Its merged schema, fixtures, reference builder, precedent handling, and consumer-facing evidence do not silently make it canonical doctrine.\n\nThe temporal/schema compatibility extension is **Accepted ADR-030**. Its research and implementation evidence, including #255 and #256, established versioned compatibility/currentness checks and adversarial consumer behavior before acceptance. ADR-030 acceptance does not promote ADR-029.\n\n**ADR-028 is Accepted** and separately preserves the language-neutral normative core and optional implementation-profile boundary. Together, ADR-028 and ADR-030 keep implementation language and temporal-policy consumers from capturing core Agent Memory semantics while ADR-029 remains independently maturity-gated.\n\n"""
          p.write_text(text[:start] + new_section + text[end:], encoding="utf-8")

          # The patch workflow is intentionally one-shot and must not remain in the repository.
          Path(".github/workflows/271-coherence-repair.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align #271 public maturity and governance surfaces"
          git push origin HEAD:review/271-coherence
