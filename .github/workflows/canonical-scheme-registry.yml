name: Canonicalization Scheme Registry Qualification

on:
  pull_request:
    paths:
      - "reference/fixtures/runtime/canonicalization-scheme-registry-v1.json"
      - "reference/canonical_scheme_registry_candidate.py"
      - "reference/tests/test_canonical_scheme_registry_candidate.py"
      - ".github/workflows/canonical-scheme-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Execute frozen scheme registry contract
        run: python -m unittest reference.tests.test_canonical_scheme_registry_candidate
