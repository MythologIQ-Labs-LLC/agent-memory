name: Canonicalization Scheme Registry Qualification

on:
  pull_request:
    paths:
      - "reference/fixtures/runtime/canonicalization-scheme-registry-v1.json"
      - "reference/canonical_scheme_registry_candidate.py"
      - "reference/tests/test_canonical_scheme_registry_candidate.py"
      - "reference/tests/test_canonical_scheme_registry_envelope.py"
      - "reports/benchmarks/runtime/620-canonical-scheme-registry/QUALIFICATION.md"
      - ".github/workflows/canonical-scheme-registry.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Execute frozen scheme registry contract
        run: |
          python -m unittest \
            reference.tests.test_canonical_scheme_registry_candidate \
            reference.tests.test_canonical_scheme_registry_envelope
