name: Independent AMB Competitive Run

on:
  workflow_dispatch:
    inputs:
      lane_id:
        description: "Frozen PrecisionMemBench retrieval lane this run executes when dataset=precisionmembench and mode=retrieval (an accepted lane is refused)"
        required: true
        default: "amb-precisionmembench-retrieval-v5"
        type: choice
        options:
          - amb-precisionmembench-retrieval-v1
          - amb-precisionmembench-retrieval-v2
          - amb-precisionmembench-retrieval-v3
          - amb-precisionmembench-retrieval-v4
          - amb-precisionmembench-retrieval-v5
      dataset:
        description: "AMB dataset"
        required: true
        default: "longmemeval"
        type: choice
        options:
          - longmemeval
          - locomo
          - lifebench
          - personamem
          - precisionmembench
      split:
        description: "Exact AMB split (for example s, locomo10, en, 32k, single-turn)"
        required: true
        default: "s"
        type: string
      memory:
        description: "AMB memory provider key (mem0-explicit is the #640 frozen Mem0 OSS row)"
        required: true
        default: "agent-memory"
        type: choice
        options:
          - agent-memory
          - agent-memory-shadow
          - bm25
          - mem0-explicit
          - hindsight
          - mem0
          - cognee
          - supermemory
      mode:
        description: "AMB evaluation mode"
        required: true
        default: "rag"
        type: choice
        options:
          - rag
          - retrieval
      query_limit:
        description: "Bounded query count; use 0 for the full split"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: amb-competitive-${{ github.ref }}-${{ inputs.lane_id }}-${{ inputs.dataset }}-${{ inputs.split }}-${{ inputs.memory }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AMB_REVISION: 03c1d0f1d27da63034f0931121c858faba512383
      LANE_FILE: reference/agentmem_ref/evaluation/lanes/${{ inputs.lane_id }}.json
      MEM0_PIN: mem0ai==2.2.1
      UV_PIN: uv==0.8.17
      MEM0_TELEMETRY: "false"
      HF_HOME: /tmp/amb-hf-home
      GEMINI_API_KEY: ${{ secrets.AMB_GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.AMB_GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.AMB_OPENAI_API_KEY }}
      SUPERMEMORY_API_KEY: ${{ secrets.AMB_SUPERMEMORY_API_KEY }}
      OMB_ANSWER_LLM: gemini
      OMB_ANSWER_MODEL: gemini-2.5-flash-lite
      OMB_JUDGE_LLM: gemini
      OMB_JUDGE_MODEL: gemini-2.5-flash-lite
    steps:
      - name: Checkout Agent Memory
        uses: actions/checkout@v4
        with:
          # full history: the Runtime Baseline checker diffs against the frozen revision
          fetch-depth: 0

      - name: Checkout frozen AMB
        uses: actions/checkout@v4
        with:
          repository: vectorize-io/agent-memory-benchmark
          ref: ${{ env.AMB_REVISION }}
          path: .external/amb
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve credential posture
        shell: bash
        run: |
          set -euo pipefail
          mode='${{ inputs.mode }}'
          memory='${{ inputs.memory }}'

          if [ "$mode" = "retrieval" ] && { [ "$memory" = "agent-memory" ] || [ "$memory" = "agent-memory-shadow" ] || [ "$memory" = "bm25" ] || [ "$memory" = "mem0-explicit" ]; }; then
            # Frozen AMB constructs its configured answer client even though RetrievalMode
            # explicitly makes no LLM calls. Supply an inert value only to satisfy client
            # construction; this value is never valid benchmark-generation authority.
            if [ -z "${GEMINI_API_KEY}" ]; then
              echo "GEMINI_API_KEY=retrieval-only-unused" >> "$GITHUB_ENV"
              echo "GOOGLE_API_KEY=retrieval-only-unused" >> "$GITHUB_ENV"
            fi
            # The Mem0 explicit-memory row never reads OPENAI_API_KEY: its inert client key
            # lives in the frozen configuration and every LLM call is guarded.
            echo "Credential-free retrieval profile admitted for $memory."
            exit 0
          fi

          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "AMB_GEMINI_API_KEY is required for LLM-judged lanes and provider paths that use Gemini." >&2
            echo "Missing credential is BLOCKED, never a numeric benchmark result." >&2
            exit 2
          fi
          if [ "$memory" = "cognee" ] && [ -z "${OPENAI_API_KEY}" ]; then
            echo "AMB_OPENAI_API_KEY is required for the frozen Cognee provider." >&2
            exit 2
          fi
          if [ "$memory" = "supermemory" ] && [ -z "${SUPERMEMORY_API_KEY}" ]; then
            echo "SUPERMEMORY_API_KEY is required for the Supermemory provider." >&2
            exit 2
          fi

      - name: Install Agent Memory and the frozen AMB harness under its own lock
        shell: bash
        run: |
          set -euo pipefail
          # The frozen AMB pyproject floats most of its dependency set (hindsight-all>=0.4,
          # cognee>=0.5.4, mem0ai>=1.0.5, ...). Re-resolving that set from scratch exhausts
          # pip's backtracking budget (resolution-too-deep, run 37343360127) before a single
          # query runs. The checkout ships the exact resolution it was developed against in
          # uv.lock; install under it as pip constraints. Only this repository's own pins and
          # the lane row's declared pin (mem0ai==2.2.1, which lifts posthog) depart from the
          # lock, and the derivation is recorded in the execution identity.
          python -m pip install --upgrade pip "${UV_PIN}"
          python scripts/amb_harness_constraints.py \
            --amb-root .external/amb \
            --memory '${{ inputs.memory }}' \
            --output "$RUNNER_TEMP/amb-constraints.txt" \
            --provenance "$RUNNER_TEMP/amb-constraints-provenance.json" \
            --removals "$RUNNER_TEMP/amb-row-removals.txt"
          python -m pip install -c "$RUNNER_TEMP/amb-constraints.txt" -e . -e .external/amb
          # Locked packages that serve other providers only and would change this row's
          # product behaviour (for mem0-explicit: fastembed, via cognee). Declared in the
          # script, recorded in the provenance sidecar, removed here.
          removals="$(tr -d '\n' < "$RUNNER_TEMP/amb-row-removals.txt")"
          if [ -n "$removals" ]; then
            # shellcheck disable=SC2086
            python -m pip uninstall -y $removals
          fi

      - name: Verify the frozen Mem0 OSS row (base package, no extras)
        if: ${{ inputs.memory == 'mem0-explicit' }}
        shell: bash
        run: |
          set -euo pipefail
          # The #640 lane pins the exact release and the product-default install posture
          # (no fastembed/spaCy extras). The pin was applied as a constraint above; nothing
          # is installed here, the posture is only verified.
          python -m pip install --dry-run "${MEM0_PIN}" | tail -1
          python - <<'PY'
          import importlib.util, json, mem0
          assert mem0.__version__ == "2.2.1", mem0.__version__
          posture = {
              "mem0ai": mem0.__version__,
              "fastembed_installed": importlib.util.find_spec("fastembed") is not None,
              "spacy_installed": importlib.util.find_spec("spacy") is not None,
          }
          assert posture["fastembed_installed"] is False, "frozen row forbids the fastembed extra"
          assert posture["spacy_installed"] is False, "frozen row forbids the spaCy extra"
          print(json.dumps(posture))
          PY

      - name: Verify frozen revisions
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C .external/amb rev-parse HEAD)" = "${AMB_REVISION}"
          python - <<'PY'
          import sys
          sys.path.insert(0, "reference")
          from amb_agent_memory_bridge import verify_amb_checkout
          print(verify_amb_checkout(".external/amb"))
          PY

      - name: Record the Runtime Baseline posture of this checkout
        shell: bash
        run: |
          set -euo pipefail
          line="$(python scripts/check_runtime_baseline_equivalence.py --candidate HEAD)"
          echo "$line"
          state="$(echo "$line" | grep -oE 'equivalence: [A-Z]+' | head -n1 | cut -d' ' -f2)"
          declaration="$(python - <<'PY'
          import json, subprocess
          from pathlib import Path
          register = json.loads(Path("reports/runtime/baseline-register.json").read_text(encoding="utf-8"))
          declared = register.get("declared_successor")
          print("" if declared is None else subprocess.run(["git", "hash-object", declared["declaration"]], capture_output=True, text=True, check=True).stdout.strip())
          PY
          )"
          {
            echo "RUNTIME_BASELINE_STATE=$state"
            echo "RUNTIME_BASELINE_LINE=$line"
            echo "DECLARATION_BLOB=$declaration"
          } >> "$GITHUB_ENV"

      - name: Verify the frozen lane preconditions (PrecisionMemBench retrieval)
        if: ${{ inputs.dataset == 'precisionmembench' && inputs.mode == 'retrieval' }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "${AMB_PMB_RETURN_CAP:-}"
          mkdir -p "$RUNNER_TEMP/amb-output"
          agent-memory benchmark validate-lane "$LANE_FILE" --json | tee "$RUNNER_TEMP/amb-output/lane-validation.json"
          mkdir -p /tmp/pmb-fixtures
          python - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          lane = json.loads(Path(os.environ["LANE_FILE"]).read_text(encoding="utf-8"))
          assert lane["status"] == "frozen", lane["status"]
          assert lane["lane_id"] == "${{ inputs.lane_id }}"
          assert lane["harness"]["revision"] == os.environ["AMB_REVISION"]
          row = next(item for item in lane["systems"] if item["provider_key"] == "${{ inputs.memory }}")
          assert row["status"] == "frozen", (row["row_id"], row["status"], row.get("status_reason"))
          for path, blob in lane["harness"]["source_blobs"].items():
              if not path.startswith("reference/"):
                  continue  # upstream AMB files are bound by the upstream revision
              actual = subprocess.run(["git", "hash-object", path], capture_output=True, text=True, check=True).stdout.strip()
              assert actual == blob, (path, actual, blob)
              print(f"{path} blob {actual}: frozen")
          combined = hashlib.sha256()
          for fixture in lane["dataset"]["fixtures"]:
              target = Path("/tmp/pmb-fixtures") / fixture["name"]
              urllib.request.urlretrieve(fixture["url"], target)
              payload = target.read_bytes()
              digest = hashlib.sha256(payload).hexdigest()
              assert digest == fixture["sha256"], (fixture["name"], digest, fixture["sha256"])
              combined.update(payload)
              print(f"fixture {fixture['name']} sha256 {digest}: frozen")
          assert combined.hexdigest() == lane["dataset"]["input_sha256"], combined.hexdigest()
          print(f"input_sha256 {combined.hexdigest()}: frozen")
          PY
          echo "PRECISIONMEMBENCH_DATA_PATH=/tmp/pmb-fixtures" >> "$GITHUB_ENV"
          # The scorer must reproduce upstream's perfect-provider row before any contestant runs.
          (cd .external/amb && PRECISIONMEMBENCH_DATA_PATH=/tmp/pmb-fixtures python scripts/precisionmembench_selfcheck.py) | tee "$RUNNER_TEMP/precisionmembench-selfcheck.txt"

      - name: Run AMB profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amb-output"
          args=(run --dataset "${{ inputs.dataset }}" --split "${{ inputs.split }}" --memory "${{ inputs.memory }}" --mode "${{ inputs.mode }}" --output-dir "$RUNNER_TEMP/amb-output" --name "${{ inputs.memory }}-${GITHUB_SHA::12}")
          if [ "${{ inputs.query_limit }}" != "0" ]; then
            args+=(--query-limit "${{ inputs.query_limit }}")
          fi
          if [ "${{ inputs.memory }}" = "agent-memory-shadow" ]; then
            # Historical v4 shadow rows retain the bridge-0.3.0 recall-control sidecar contract.
            export AGENT_MEMORY_AMB_RECALL_CONTROL_SIDECAR="$RUNNER_TEMP/amb-output/recall-control.jsonl"
          fi
          if [ "${{ inputs.lane_id }}" = "amb-precisionmembench-retrieval-v5" ] && [ "${{ inputs.memory }}" = "agent-memory" ]; then
            # Bridge 0.4.0 C9 E2: causal attribution for the v5 control only.
            export AGENT_MEMORY_AMB_CROSS_FACT_SIDECAR="$RUNNER_TEMP/amb-output/cross-fact.jsonl"
          fi
          PYTHONPATH=reference python reference/run_amb_external.py --amb-root .external/amb -- "${args[@]}"

      - name: Record execution identity
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/amb-output"
          [ -f "$RUNNER_TEMP/precisionmembench-selfcheck.txt" ] && cp "$RUNNER_TEMP/precisionmembench-selfcheck.txt" "$RUNNER_TEMP/amb-output/" || true
          [ -f "$RUNNER_TEMP/amb-constraints.txt" ] && cp "$RUNNER_TEMP/amb-constraints.txt" "$RUNNER_TEMP/amb-output/" || true
          [ -f "$RUNNER_TEMP/amb-constraints-provenance.json" ] && cp "$RUNNER_TEMP/amb-constraints-provenance.json" "$RUNNER_TEMP/amb-output/" || true
          python - <<'PY'
          import importlib.metadata as md
          import importlib.util
          import json
          import os
          import subprocess
          from pathlib import Path

          def version(name):
              try:
                  return md.version(name)
              except md.PackageNotFoundError:
                  return None

          def blob(path):
              return subprocess.run(["git", "hash-object", path], capture_output=True, text=True, check=True).stdout.strip()

          lane_file = os.environ["LANE_FILE"]
          lane = json.loads(Path(lane_file).read_text(encoding="utf-8"))
          validation_path = Path(os.environ["RUNNER_TEMP"], "amb-output", "lane-validation.json")
          validation = json.loads(validation_path.read_text(encoding="utf-8")) if validation_path.is_file() else None
          provenance_path = Path(os.environ["RUNNER_TEMP"], "amb-constraints-provenance.json")
          harness_constraints = json.loads(provenance_path.read_text(encoding="utf-8")) if provenance_path.is_file() else None
          memory = "${{ inputs.memory }}"
          mode = "${{ inputs.mode }}"
          lane_applies = "${{ inputs.dataset }}" == "precisionmembench" and mode == "retrieval"
          identity = {
              "evidence_class": "same_harness_external_candidate",
              "agent_memory_revision": os.environ["GITHUB_SHA"],
              "amb_revision": os.environ["AMB_REVISION"],
              "dataset": "${{ inputs.dataset }}",
              "split": "${{ inputs.split }}",
              "memory": memory,
              "mode": mode,
              "query_limit": "${{ inputs.query_limit }}",
              "answer_model": None if mode == "retrieval" else "gemini:gemini-2.5-flash-lite",
              "judge_model": None if mode == "retrieval" else "gemini:gemini-2.5-flash-lite",
              "lane_id": lane["lane_id"] if lane_applies else None,
              "lane_file": lane_file if lane_applies else None,
              "lane_digest_sha256": None if validation is None else validation.get("lane_digest_sha256"),
              "runtime_baseline_state": os.environ.get("RUNTIME_BASELINE_STATE"),
              "runtime_baseline_line": os.environ.get("RUNTIME_BASELINE_LINE"),
              "declaration_blob": os.environ.get("DECLARATION_BLOB") or None,
              "full_selection": "${{ inputs.query_limit }}" == "0",
              "amb_pmb_return_cap": os.environ.get("AMB_PMB_RETURN_CAP"),
              "bridge_blobs": {
                  "reference/amb_agent_memory_bridge.py": blob("reference/amb_agent_memory_bridge.py"),
                  "reference/amb_mem0_explicit_bridge.py": blob("reference/amb_mem0_explicit_bridge.py"),
              },
              "resolved_packages": {
                  name: version(name)
                  for name in ("mem0ai", "qdrant-client", "sentence-transformers", "torch", "rank-bm25", "openai", "sqlalchemy", "posthog", "hindsight-all", "hindsight-client", "uv")
              },
              "harness_constraints": harness_constraints,
              "mem0_optional_components": {
                  "fastembed_installed": importlib.util.find_spec("fastembed") is not None,
                  "spacy_installed": importlib.util.find_spec("spacy") is not None,
              },
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "authority_effect": "none",
          }
          Path(os.environ["RUNNER_TEMP"], "amb-output", "execution-identity.json").write_text(json.dumps(identity, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(identity, indent=2, sort_keys=True))
          PY

      - name: Inventory raw evidence
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/amb-output" && find . -type f -print | sort | tee files.txt && while IFS= read -r file; do sha256sum "$file"; done < files.txt | tee sha256.txt

      - name: Upload raw AMB evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amb-${{ inputs.lane_id }}-${{ inputs.dataset }}-${{ inputs.split }}-${{ inputs.memory }}-${{ github.sha }}
          path: ${{ runner.temp }}/amb-output/
          if-no-files-found: warn
          retention-days: 30
