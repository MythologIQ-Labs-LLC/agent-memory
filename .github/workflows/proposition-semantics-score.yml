name: Proposition Semantics Qualification

on:
  pull_request:
    paths:
      - "reference/proposition_semantics_evaluator.py"
      - "reference/run_proposition_semantics_score.py"
      - "reference/fixtures/benchmarks/proposition-semantics/**"
      - "reference/tests/test_proposition_gold_acceptance.py"
      - "reference/tests/test_proposition_evaluator.py"
      - ".github/workflows/proposition-semantics-score.yml"

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # #631: the #594 runtime-independence interval is proven from history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Agent Memory reference dependencies
        run: python -m pip install --disable-pip-version-check -r reference/requirements.txt
      - name: Accepted-gold integrity
        run: python -m unittest reference.tests.test_proposition_gold_acceptance
      - name: "#594 historical runtime-independence interval (full history required)"
        env:
          AGENT_MEMORY_REQUIRE_594_HISTORY: "1"
        run: |
          python -m unittest \
            reference.tests.test_proposition_evaluator.SampleIndependenceTests \
            reference.tests.test_proposition_evaluator.HistoricalIndependenceBoundaryTests
      - name: Score accepted gold
        run: python reference/run_proposition_semantics_score.py --output-dir proposition-score
      - name: Upload score evidence
        uses: actions/upload-artifact@v4
        with:
          name: proposition-semantics-score-v1
          path: proposition-score/
          if-no-files-found: error
          retention-days: 30
