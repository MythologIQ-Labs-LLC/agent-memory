name: Canonical JSON v2 Migration Contract

on:
  pull_request:
    paths:
      - "reference/fixtures/runtime/canonical-json-v2-migration-v1.json"
      - "reference/validate_canonical_json_v2_migration_contract.py"
      - "reference/validate_canonical_json_v2_migration_outcome_boundary.py"
      - ".github/workflows/canonical-json-v2-migration-contract.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate frozen migration contract
        run: python reference/validate_canonical_json_v2_migration_contract.py --repo-root .

      - name: Validate transaction vs restart qualification boundary
        run: python reference/validate_canonical_json_v2_migration_outcome_boundary.py --repo-root .
