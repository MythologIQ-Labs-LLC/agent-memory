name: SQLite Production Substrate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install reference dependencies
        run: python -m pip install --disable-pip-version-check -r reference/requirements.txt

      - name: Execute focused SQLite qualification tests
        run: python -m unittest discover -s reference/tests -t reference -p 'test_sqlite_production_substrate.py'

      - name: Execute RC developer facade tests
        run: python -m unittest discover -s reference/tests -t reference -p 'test_developer_facade.py'

      - name: Execute RC cognitive-memory scenario tests
        run: python -m unittest discover -s reference/tests -t reference -p 'test_rc_cognitive_memory_scenario.py'

      - name: Verify installed facade and packaged local profile
        run: |
          python -m pip install --disable-pip-version-check .
          cd /tmp
          python - <<'PY'
          import json
          import importlib.resources
          from agentmem_ref import AgentMemory

          profile = importlib.resources.files("agentmem_ref") / "_profiles" / "rc1-local.json"
          payload = json.loads(profile.read_text(encoding="utf-8"))
          assert AgentMemory.__name__ == "AgentMemory"
          assert payload["runtime"]["profile_id"] == "rc1-local-sqlite-composition"
          print("installed AgentMemory facade and packaged rc1-local profile verified")
          PY

      - name: Verify package architecture
        run: python scripts/restructure_package.py --check

      - name: Emit exact-head SQLite qualification evidence
        env:
          AGENT_MEMORY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python reference/run_sqlite_production_qualification.py
          --agent-memory-revision "$AGENT_MEMORY_COMMIT"
          --runtime-config reference/fixtures/runtime-configuration/reference-composed-runtime.json
          --write-count 40
          --read-count 80
          --output sqlite-production-substrate.json

      - name: Emit exact-head RC cognitive-memory lifecycle evidence
        env:
          AGENT_MEMORY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          PYTHONPATH=reference python reference/run_rc_cognitive_memory_scenario.py
          --agent-memory-revision "$AGENT_MEMORY_COMMIT"
          --output rc-cognitive-memory-scenario.json

      - name: Validate qualification evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("sqlite-production-substrate.json").read_text())
          if len(report["agent_memory_revision"]) != 40:
              raise SystemExit("SQLite evidence is not exact-head bound")
          if report["claim"] != "production_credible_single_host_canonical_substrate_rc1":
              raise SystemExit("unexpected SQLite qualification claim")
          if report["profile"]["substrate_profile"] != "sqlite_single_host_v1":
              raise SystemExit("unexpected SQLite substrate profile")
          if report["profile"]["durability_profile"] != "sqlite_transactional_runtime_v1":
              raise SystemExit("unexpected SQLite durability profile")
          failed = [
              name for name, passed in report["structural_invariants"].items()
              if not passed
          ]
          if failed:
              raise SystemExit(f"SQLite qualification invariants failed: {failed}")

          scenario = json.loads(Path("rc-cognitive-memory-scenario.json").read_text())
          if len(scenario["agent_memory_revision"]) != 40:
              raise SystemExit("RC cognitive-memory evidence is not exact-head bound")
          if not scenario["passed"]:
              failed = [name for name, passed in scenario["checks"].items() if not passed]
              raise SystemExit(f"RC cognitive-memory checks failed: {failed}")
          if "health_score" in scenario or "score" in scenario:
              raise SystemExit("RC cognitive-memory evidence must not emit an aggregate health score")
          for section in ("quality", "governance", "runtime_recovery"):
              if section not in scenario:
                  raise SystemExit(f"RC cognitive-memory evidence missing {section}")
          print(
              f"validated {len(report['structural_invariants'])} SQLite qualification invariants "
              f"and {len(scenario['checks'])} RC cognitive-memory checks"
          )
          PY

      - name: Upload SQLite and RC lifecycle evidence
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-production-substrate
          path: |
            sqlite-production-substrate.json
            rc-cognitive-memory-scenario.json
          if-no-files-found: error

      - name: Publish SQLite qualification summary
        if: always()
        run: |
          {
            echo "## SQLite production canonical substrate and RC lifecycle"
            echo ""
            echo "This workflow qualifies the bounded single-host SQLite profile, the RC developer facade, and the deterministic end-to-end cognitive-memory lifecycle over it. It does not claim distributed or multi-host durability."
            echo ""
            echo '```'
            echo "python -m unittest discover -s reference/tests -t reference -p 'test_sqlite_production_substrate.py'"
            echo "python -m unittest discover -s reference/tests -t reference -p 'test_developer_facade.py'"
            echo "python -m unittest discover -s reference/tests -t reference -p 'test_rc_cognitive_memory_scenario.py'"
            echo "python reference/run_sqlite_production_qualification.py --agent-memory-revision <exact-40-hex-commit> --runtime-config reference/fixtures/runtime-configuration/reference-composed-runtime.json --output sqlite-production-substrate.json"
            echo "PYTHONPATH=reference python reference/run_rc_cognitive_memory_scenario.py --agent-memory-revision <exact-40-hex-commit> --output rc-cognitive-memory-scenario.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
