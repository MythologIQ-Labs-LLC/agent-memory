name: Code Reality Comparator

on:
  pull_request:
    paths:
      - "reference/fixtures/code-reality/**"
      - "reference/agentmem_ref/code_reality_comparator.py"
      - "reference/tests/test_code_reality_comparator.py"
      - "reference/run_code_reality_comparator.py"
      - ".github/workflows/code-reality-comparator.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CODEGENOME_COMMIT: d2578729a46d495369bd7613845002d50cf20f4c
  GRAPHIFY_COMMIT: 7fe58b0b0f3873be9a21c30106b8b8527c353aa6

jobs:
  compare-code-reality:
    runs-on: ubuntu-latest
    env:
      AGENT_MEMORY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      FIXTURE_DIR: ${{ github.workspace }}/reference/fixtures/code-reality
    steps:
      - name: Checkout Agent Memory
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Agent Memory reference dependencies
        run: python -m pip install --disable-pip-version-check -r reference/requirements.txt

      - name: Run comparator normalizer unit tests
        env:
          PYTHONPATH: reference
        run: python -m unittest reference/tests/test_code_reality_comparator.py

      - name: Fetch exact CodeGenome source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/MythologIQ-Labs-LLC/CodeGenome.git /tmp/codegenome
          git -C /tmp/codegenome fetch --depth=1 origin "$CODEGENOME_COMMIT"
          git -C /tmp/codegenome checkout --detach "$CODEGENOME_COMMIT"
          test "$(git -C /tmp/codegenome rev-parse HEAD)" = "$CODEGENOME_COMMIT"

      - name: Build pinned CodeGenome CLI
        working-directory: /tmp/codegenome
        run: cargo build --release -p codegenome-cli

      - name: Execute CodeGenome ground-truth queries
        run: |
          mkdir -p /tmp/code-reality-raw
          /tmp/codegenome/target/release/codegenome index \
            --source-dir "$FIXTURE_DIR" \
            --store-dir /tmp/codegenome-store \
            > /tmp/code-reality-raw/codegenome-index.txt

          /tmp/codegenome/target/release/codegenome query \
            --store-dir /tmp/codegenome-store \
            --file main.rs --line 8 --direction downstream --json \
            > /tmp/code-reality-raw/codegenome-main-downstream.json

          /tmp/codegenome/target/release/codegenome query \
            --store-dir /tmp/codegenome-store \
            --file main.rs --line 8 --direction upstream --json \
            > /tmp/code-reality-raw/codegenome-main-upstream.json

          /tmp/codegenome/target/release/codegenome query \
            --store-dir /tmp/codegenome-store \
            --file decoy.rs --line 8 --direction downstream --json \
            > /tmp/code-reality-raw/codegenome-decoy-downstream.json

      - name: Fetch exact Graphify source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Graphify-Labs/graphify.git /tmp/graphify
          git -C /tmp/graphify fetch --depth=1 origin "$GRAPHIFY_COMMIT"
          git -C /tmp/graphify checkout --detach "$GRAPHIFY_COMMIT"
          test "$(git -C /tmp/graphify rev-parse HEAD)" = "$GRAPHIFY_COMMIT"

      - name: Install pinned Graphify runtime
        run: |
          python -m venv /tmp/graphify-venv
          /tmp/graphify-venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          /tmp/graphify-venv/bin/python -m pip install --disable-pip-version-check -e /tmp/graphify

      - name: Execute Graphify Rust extraction
        env:
          GRAPHIFY_FIXTURE_DIR: ${{ github.workspace }}/reference/fixtures/code-reality
        run: |
          /tmp/graphify-venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          from graphify.extract import extract

          root = Path(os.environ["GRAPHIFY_FIXTURE_DIR"])
          files = sorted(root.glob("*.rs"))
          result = extract(files, cache_root=root)
          Path("/tmp/code-reality-raw/graphify-graph.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Emit exact-head matched comparator report
        env:
          PYTHONPATH: reference
        run: |
          python reference/run_code_reality_comparator.py \
            --agent-memory-commit "$AGENT_MEMORY_COMMIT" \
            --fixture-dir "$FIXTURE_DIR" \
            --codegenome-main-downstream /tmp/code-reality-raw/codegenome-main-downstream.json \
            --codegenome-main-upstream /tmp/code-reality-raw/codegenome-main-upstream.json \
            --codegenome-decoy-downstream /tmp/code-reality-raw/codegenome-decoy-downstream.json \
            --graphify-graph /tmp/code-reality-raw/graphify-graph.json \
            --output /tmp/code-reality-raw/code-reality-comparator.json

      - name: Verify bounded ground truth
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("/tmp/code-reality-raw/code-reality-comparator.json").read_text())
          assert report["agent_memory_commit"] == os.environ["AGENT_MEMORY_COMMIT"]
          assert report["implementations"]["codegenome"]["commit"] == os.environ["CODEGENOME_COMMIT"]
          assert report["implementations"]["graphify"]["commit"] == os.environ["GRAPHIFY_COMMIT"]
          assert report["matched_result"]["codegenome_ground_truth_passed"] is True
          assert report["matched_result"]["graphify_ground_truth_passed"] is True
          assert report["matched_result"]["both_reproduce_requested_fixture_facts"] is True
          assert report["matched_result"]["winner"] is None
          PY

      - name: Upload raw and normalized comparator evidence
        uses: actions/upload-artifact@v4
        with:
          name: code-reality-comparator-${{ env.AGENT_MEMORY_COMMIT }}
          path: /tmp/code-reality-raw
          if-no-files-found: error
