name: agmi Agent Memory Integrity Qualification

on:
  pull_request:
    paths:
      - 'reports/gauntlet/agmi-agent-memory-v1/**'
      - 'reports/runtime/baseline-register.json'
      - 'reports/runtime/baseline-*.json'
      - 'scripts/check_runtime_baseline_equivalence.py'
      - 'scripts/runtime_baseline_identity.py'
      - 'scripts/run_agmi_agent_memory_qualification.py'
      - 'scripts/validate_agmi_agent_memory_qualification.py'
      - '.github/workflows/agmi-agent-memory-qualification.yml'
      - 'reference/agentmem_ref/**'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reproduce-external-row:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Agent Memory source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Agent Memory package
        run: python -m pip install -e .

      - name: Classify the candidate against the current Runtime Baseline
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          out="$(python scripts/check_runtime_baseline_equivalence.py --candidate HEAD)"
          echo "$out"
          state="$(echo "$out" | grep -oE 'equivalence: [A-Z]+' | head -n1 | cut -d' ' -f2)"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Read the current baseline from the register
        id: current
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          register = json.loads(Path("reports/runtime/baseline-register.json").read_text(encoding="utf-8"))
          entry = register["baselines"][-1]
          boundary = json.loads(Path(entry["source_boundary"]).read_text(encoding="utf-8"))
          print(f"baseline_id={entry['baseline_id']}")
          print(f"boundary={entry['source_boundary']}")
          print(f"revision={boundary['frozen_revision']}")
          print(f"published_commit={entry['published_commit'] or ''}")
          PY

      - name: Classify the contestant against the register
        id: contestant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          register = json.loads(Path("reports/runtime/baseline-register.json").read_text(encoding="utf-8"))
          entries = register["baselines"]
          revisions = {}
          for item in entries:
              boundary = json.loads(Path(item["source_boundary"]).read_text(encoding="utf-8"))
              revisions[boundary["frozen_revision"]] = item["baseline_id"]
          current = entries[-1]["baseline_id"]
          pinned = json.loads(Path("reports/gauntlet/agmi-agent-memory-v1/qualification.json").read_text(encoding="utf-8"))["agent_memory"]["runtime_baseline_revision"]
          if pinned == next(rev for rev, bid in revisions.items() if bid == current):
              print("contestant=current")
          elif pinned in revisions:
              print("contestant=retired")
              print(f"contestant_baseline={revisions[pinned]}")
          else:
              raise SystemExit(f"contestant pins {pinned}, which is no Runtime Baseline in the register")
          print(f"contestant_revision={pinned}")
          PY

      - name: Transition notice
        if: steps.classify.outputs.state == 'TRANSITION'
        run: |
          echo "The register declares a successor and the candidate is in a pinned transition."
          echo "agmi reproduction is skipped: no evidence may claim ${{ steps.current.outputs.revision }} from this checkout."

      - name: Retired contestant notice
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'retired'
        run: |
          echo "The agmi profile reports/gauntlet/agmi-agent-memory-v1 is retired: it pins a predecessor Runtime Baseline, so no agmi evidence is reproduced or uploaded from this checkout."
          echo "It pins ${{ steps.contestant.outputs.contestant_revision }} (${{ steps.contestant.outputs.contestant_baseline }}); the current Runtime Baseline is ${{ steps.current.outputs.revision }} (${{ steps.current.outputs.baseline_id }})."
          echo "Re-pinning it to the successor is a later two-step of its own (docs/67 Step B1); nothing here claims the current revision."

      - name: Refuse a stale agmi profile
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.current.outputs.revision }}" <<'PY'
          import json
          import sys
          from pathlib import Path

          revision = sys.argv[1]
          profile = json.loads(Path("reports/gauntlet/agmi-agent-memory-v1/qualification.json").read_text(encoding="utf-8"))
          pinned = profile["agent_memory"]["runtime_baseline_revision"]
          assert pinned == revision, f"agmi profile pins {pinned}; the current Runtime Baseline is {revision}"
          print(f"agmi profile pins the current Runtime Baseline {revision}")
          PY

      - name: Checkout exact agmi source
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        shell: bash
        run: |
          set -euo pipefail
          AGMI_REV="76ddf21af25ce35e427e5614afb70d1fe96e32a2"
          git clone --quiet https://github.com/tech4biz-yasha/agmi.git external/agmi
          git -C external/agmi checkout --quiet --detach "$AGMI_REV"
          test "$(git -C external/agmi rev-parse HEAD)" = "$AGMI_REV"
          grep -q '^version = "0.6.2"' external/agmi/pyproject.toml
          grep -q '^MIT License$' external/agmi/LICENSE

      - name: Install isolated qualification dependencies
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        run: python -m pip install -e ./external/agmi pytest

      - name: Record exact source and environment identity
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agmi-evidence
          {
            echo "agent_memory_checkout=$(git rev-parse HEAD)"
            echo "agent_memory_baseline_id=${{ steps.current.outputs.baseline_id }}"
            echo "agent_memory_frozen_runtime=${{ steps.current.outputs.revision }}"
            echo "agent_memory_runtime_source_boundary=${{ steps.current.outputs.boundary }}"
            echo "agent_memory_published_commit=${{ steps.current.outputs.published_commit }}"
            echo "agmi_revision=$(git -C external/agmi rev-parse HEAD)"
            python --version
            python - <<'PY'
          import importlib.metadata as md
          print("agent-memory-reference=" + md.version("agent-memory-reference"))
          print("agent-memory-integrity=" + md.version("agent-memory-integrity"))
          PY
          } | tee agmi-evidence/source-environment.txt

      - name: Run upstream Agent Memory test unchanged
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q external/agmi/tests/test_agent_memory.py \
            --junitxml=agmi-evidence/upstream-agent-memory.xml \
            2>&1 | tee agmi-evidence/upstream-agent-memory.txt

      - name: Produce raw T1-T9 external evidence
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        run: |
          python scripts/run_agmi_agent_memory_qualification.py \
            --output agmi-evidence/raw-result.json

      - name: Validate external observation and preserve T9 finding
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        run: |
          python scripts/validate_agmi_agent_memory_qualification.py \
            agmi-evidence/raw-result.json \
            | tee agmi-evidence/validation.txt

      - name: Inventory qualification evidence
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        shell: bash
        run: |
          set -euo pipefail
          find agmi-evidence -type f -print | sort | tee agmi-evidence/files.txt
          while IFS= read -r file; do sha256sum "$file"; done < agmi-evidence/files.txt | tee agmi-evidence/sha256.txt
          test -s agmi-evidence/raw-result.json
          test -s agmi-evidence/upstream-agent-memory.xml
          test -s agmi-evidence/upstream-agent-memory.txt
          test -s agmi-evidence/source-environment.txt
          test -s agmi-evidence/validation.txt

      - name: Upload agmi qualification evidence
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        uses: actions/upload-artifact@v4
        with:
          name: agmi-agent-memory-integrity-v1
          path: agmi-evidence/
          if-no-files-found: error
          retention-days: 90
