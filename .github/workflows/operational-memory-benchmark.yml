name: Operational Memory Benchmark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-representations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Agent Memory and isolated benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check -r reference/requirements.txt
          python -m pip install --disable-pip-version-check numpy==2.2.6

      - name: Run matched local representation benchmark
        env:
          AGENT_MEMORY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          PYTHONPATH=reference python reference/run_operational_memory_benchmark.py
          --agent-memory-commit "$AGENT_MEMORY_COMMIT"
          --output operational-memory-benchmark.json

      - name: Show local benchmark summary
        run: |
          python - <<'PY'
          import json
          report = json.load(open("operational-memory-benchmark.json", encoding="utf-8"))
          for row in report["representations"]:
              current = row["current_only"]["all"]
              stale = row["stale_contaminated"]["all"]
              print(row["representation"], "current_mae=", current["mean_absolute_error_px"], "success=", current["intercept_success_rate"], "stale_mae=", stale["mean_absolute_error_px"])
          PY

      - name: Upload local benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: operational-memory-local-benchmark
          path: operational-memory-benchmark.json
          if-no-files-found: error

      - name: Test native failure-memory benchmark contract
        run: >-
          PYTHONPATH=reference python -m unittest discover
          -s reference/tests -t reference
          -p 'test_failure_memory_benchmark.py'

      - name: Run native failure-memory benchmark
        env:
          AGENT_MEMORY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          PYTHONPATH=reference python reference/run_failure_memory_benchmark.py
          --agent-memory-commit "$AGENT_MEMORY_COMMIT"
          --output failure-memory-benchmark.json

      - name: Validate failure-memory evidence boundaries
        run: |
          python - <<'PY'
          import json

          report = json.load(open("failure-memory-benchmark.json", encoding="utf-8"))
          quality = report["quality"]
          governance = report["governance"]
          if quality["identity_equivalence_failures"] != 0:
              raise SystemExit("failure identity equivalence regression")
          if quality["identity_separation_failures"] != 0:
              raise SystemExit("distinct failure identities collapsed")
          if quality["repeated_failure_retrieval"]["recall"] != 1.0:
              raise SystemExit("bounded repeated-failure retrieval regression")
          for key, value in governance.items():
              if key.endswith("_violations") and value != 0:
                  raise SystemExit(f"governance violation: {key}={value}")
          if governance["failure_memory_authority_effect"] != "none":
              raise SystemExit("failure memory must not acquire authority")
          if governance["action_authority_claimed"]:
              raise SystemExit("benchmark must not claim downstream action authority")
          if not report["claim_boundary"]["no_aggregate_health_score"]:
              raise SystemExit("aggregate health score boundary missing")
          print("validated native failure-memory quality/performance/governance separation")
          PY

      - name: Upload native failure-memory evidence
        uses: actions/upload-artifact@v7
        with:
          name: native-failure-memory-benchmark
          path: failure-memory-benchmark.json
          if-no-files-found: error

  vjepa2-1-frozen-representation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agent Memory
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch exact V-JEPA 2.1 source
        run: |
          git init /tmp/vjepa2
          git -C /tmp/vjepa2 remote add origin https://github.com/facebookresearch/vjepa2.git
          git -C /tmp/vjepa2 fetch --depth=1 origin 45d025f636dfc58fc2426905fc4a1ab755b1c3e5
          git -C /tmp/vjepa2 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/vjepa2 rev-parse HEAD)" = "45d025f636dfc58fc2426905fc4a1ab755b1c3e5"

      - name: Install isolated CPU comparator environment
        run: |
          python -m venv /tmp/vjepa-benchmark
          /tmp/vjepa-benchmark/bin/python -m pip install --disable-pip-version-check -r reference/requirements.txt
          /tmp/vjepa-benchmark/bin/python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.7.1 torchvision==0.22.1
          /tmp/vjepa-benchmark/bin/python -m pip install --disable-pip-version-check numpy==2.2.6 timm==1.0.19 einops==0.8.1

      - name: Download and verify official V-JEPA 2.1 ViT-B checkpoint
        run: |
          curl --fail --location --retry 3 https://dl.fbaipublicfiles.com/vjepa2/vjepa2_1_vitb_dist_vitG_384.pt --output /tmp/vjepa2_1_vitb_dist_vitG_384.pt
          echo "848a77c33cc9e6649ed2119c9bea1e2c569bcdab9539ff3e7c02ccc2959ddf4d  /tmp/vjepa2_1_vitb_dist_vitG_384.pt" | sha256sum --check

      - name: Run pinned V-JEPA 2.1 frozen-representation comparator
        env:
          AGENT_MEMORY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          PYTHONPATH=reference
          /tmp/vjepa-benchmark/bin/python reference/run_vjepa2_operational_comparator.py
          --agent-memory-commit "$AGENT_MEMORY_COMMIT"
          --vjepa-source /tmp/vjepa2
          --checkpoint /tmp/vjepa2_1_vitb_dist_vitG_384.pt
          --expected-checkpoint-sha256 848a77c33cc9e6649ed2119c9bea1e2c569bcdab9539ff3e7c02ccc2959ddf4d
          --output vjepa2-operational-comparator.json

      - name: Show V-JEPA comparator summary
        run: |
          python - <<'PY'
          import json
          report = json.load(open("vjepa2-operational-comparator.json", encoding="utf-8"))
          result = report["representation_result"]
          print("checkpoint_sha256=", report["peer"]["checkpoint_sha256"])
          print("current=", result["current_only"]["all"])
          print("degraded=", result["current_only"]["degraded"])
          print("stale=", result["stale_contaminated"]["all"])
          PY

      - name: Upload V-JEPA comparator evidence
        uses: actions/upload-artifact@v7
        with:
          name: operational-memory-vjepa2-comparator
          path: vjepa2-operational-comparator.json
          if-no-files-found: error
