name: CLI Doctor Boundary

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install full reference dependencies
        run: python -m pip install --disable-pip-version-check -r reference/requirements.txt

      - name: Install Agent Memory distribution from repository
        run: python -m pip install --disable-pip-version-check .

      - name: Smoke-test installed console command
        run: |
          agent-memory --help
          agent-memory config validate \
            --config reference/fixtures/runtime-configuration/reference-composed-runtime.json \
            --json > installed-config-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("installed-config-validation.json").read_text())
          if report["valid"] is not True:
              raise SystemExit("installed console command did not validate reference configuration")
          if report["authority_effect"] != "none":
              raise SystemExit("installed configuration command cannot create authority")
          PY

      - name: Smoke-test attach-to-existing-stack configuration
        run: |
          agent-memory config validate \
            --config reference/fixtures/runtime-configuration/attached-existing-stack.json \
            --qualifications reference/fixtures/runtime-configuration/qualification-bindings.json \
            --json > attached-config-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("attached-config-validation.json").read_text())
          if report["entry_mode"] != "attach_existing_stack":
              raise SystemExit("expected attach_existing_stack reference validation")
          if report["qualification_binding_count"] != 2:
              raise SystemExit("independent qualification bindings were not consumed")
          PY

      - name: Execute targeted CLI/doctor tests
        run: python -m unittest discover -s reference/tests -t reference -p 'test_cli_doctor.py'

      - name: Emit exact-head CLI/doctor evidence
        env:
          AGENT_MEMORY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python reference/run_cli_doctor.py
          --agent-memory-commit "$AGENT_MEMORY_COMMIT"
          --output cli-doctor-evidence.json

      - name: Validate emitted CLI/doctor evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("cli-doctor-evidence.json").read_text())
          if len(report["agent_memory_commit"]) != 40:
              raise SystemExit("CLI/doctor evidence is not exact-head bound")
          invariants = report["structural_invariants"]
          non_boolean = [name for name, value in invariants.items() if type(value) is not bool]
          if non_boolean:
              raise SystemExit(f"CLI/doctor invariants are not JSON booleans: {non_boolean}")
          failed = [name for name, passed in invariants.items() if not passed]
          if failed:
              raise SystemExit(f"CLI/doctor invariants failed: {failed}")
          if report["authority_effect"] != "none":
              raise SystemExit("CLI/doctor boundary cannot create authority")
          if report["doctor_examples"]["state_recovered"]["provider_availability"]["status"] != "not_probed":
              raise SystemExit("doctor must not fabricate live provider health")
          print(f"validated {len(invariants)} CLI/doctor invariants")
          PY

      - name: Upload CLI/doctor evidence
        uses: actions/upload-artifact@v7
        with:
          name: cli-doctor-evidence
          path: |
            cli-doctor-evidence.json
            installed-config-validation.json
            attached-config-validation.json
          if-no-files-found: error

      - name: Publish CLI/doctor summary
        if: always()
        run: |
          {
            echo "## Installed Agent Memory command boundary"
            echo ""
            echo "Repository installation exposes agent-memory config validate and agent-memory doctor over the same portable configuration/recovery contracts."
            echo ""
            echo "doctor distinguishes configuration, durable recovery, currentness, and unprobed provider availability rather than emitting a generic healthy flag."
            echo ""
            echo '```'
            echo "python -m pip install ."
            echo "agent-memory config validate --config <config.json>"
            echo "agent-memory doctor --config <config.json> --state-dir <state-dir>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  wheel-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build --outdir dist .
      - run: python -m venv /tmp/wheel-venv && /tmp/wheel-venv/bin/python -m pip install --disable-pip-version-check dist/*.whl
      - name: Installed package resolves canonical schemas
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/python - <<'PY'
          import sys
          import agentmem_ref.receipts as receipts
          try:
              receipts.validate("decision-receipt.schema.json", {})
          except ValueError as exc:
              if "decision-receipt.schema.json at" in str(exc):
                  print("schema resolved from wheel:", exc)
                  sys.exit(0)
              print("unexpected ValueError:", exc)
              sys.exit(1)
          except FileNotFoundError as exc:
              print("schema NOT resolved from wheel:", exc)
              sys.exit(1)
          print("validate returned without error; empty receipt should not validate")
          sys.exit(1)
          PY
      - name: Installed runtime modules resolve their schemas
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/python - <<'PY'
          import sys
          from agentmem_ref import discovery, runtime_config

          expected = {
              "runtime_config": (runtime_config._configuration_schema, "runtime-configuration.schema.json"),
              "discovery": (discovery._probe_schema, "provider-probes.schema.json"),
          }
          for name, (loader, schema_name) in expected.items():
              try:
                  schema = loader()
              except Exception as exc:
                  print(f"{name}: schema NOT resolved from wheel: {type(exc).__name__}: {exc}")
                  sys.exit(1)
              if not isinstance(schema, dict) or not str(schema.get("$id", "")).endswith(schema_name):
                  print(f"{name}: unexpected schema payload")
                  sys.exit(1)
              print(f"{name}: resolved from wheel: {schema['$id']}")
          # Sprint 4a: the public contract's schemas ship in the wheel too.
          from agentmem_ref.api import contract, surface
          envelope = {
              "contract_version": contract.CONTRACT_VERSION, "proposal_id": "p", "actor_id": "a", "charter_version": "c",
              "target_reference": "t", "target_class": "M2_OPERATIONAL_ASSOCIATION", "scope": "s", "operation": "promotion",
              "current_strength": "observed", "proposed_strength": "reinforced", "downstream_authority": "A1_RECOMMENDATION_INFLUENCE",
              "reversibility": "reversible", "risk_class": "low", "evidence_refs": ["e"],
          }
          try:
              contract.validate_proposal_envelope(envelope)
          except Exception as exc:
              print(f"api: envelope schema NOT resolved from wheel: {type(exc).__name__}: {exc}")
              sys.exit(1)
          print("api: proposal envelope validated from wheel; surface exports", surface.__all__)
          # Sprint 4c-1: the read-only inspections and the target envelope ship too.
          if not {"history", "posture"} <= set(surface.__all__):
              print("api: history/posture missing from surface.__all__:", surface.__all__)
              sys.exit(1)
          try:
              contract.validate_target_envelope({"contract_version": contract.CONTRACT_VERSION, "target_reference": "t"})
          except Exception as exc:
              print(f"api: target envelope schema NOT resolved from wheel: {type(exc).__name__}: {exc}")
              sys.exit(1)
          print("api: target envelope validated from wheel; contract", contract.CONTRACT_VERSION)
          # Sprint 4c-2: the action-authority and execution-evidence stages and their schemas ship too.
          if not {"authorize", "witness"} <= set(surface.__all__):
              print("api: authorize/witness missing from surface.__all__:", surface.__all__)
              sys.exit(1)
          try:
              contract.validate_action_envelope({**envelope, "operation": "action_execution", "state_snapshot": "v1",
                                                 "action_id": "action:1", "description": "d", "skill_version_ref": "t"})
              contract.validate_observation_envelope({"contract_version": contract.CONTRACT_VERSION, "action_id": "action:1",
                                                      "witness_ref": "w", "enforcement_mode": "mechanical", "delivery_status": "delivered",
                                                      "enforcement_point_status": "reached", "action_status": "executed",
                                                      "liveness_status": "healthy", "observed_at": "now"})
          except Exception as exc:
              print(f"api: action/observation schema NOT resolved from wheel: {type(exc).__name__}: {exc}")
              sys.exit(1)
          print("api: action envelope and execution observation validated from wheel; contract", contract.CONTRACT_VERSION)
          sys.exit(0)
          PY
      - name: Installed evidence modules import
        working-directory: /tmp
        run: /tmp/wheel-venv/bin/python -c "import agentmem_ref.portable_evidence"
      - name: Installed console command
        working-directory: /tmp
        run: /tmp/wheel-venv/bin/agent-memory --help
