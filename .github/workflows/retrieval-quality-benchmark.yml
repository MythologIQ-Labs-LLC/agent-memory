name: Retrieval Quality Benchmark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rc-retrieval-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install reference dependencies
        run: python -m pip install --disable-pip-version-check -r reference/requirements.txt
      - name: Execute deterministic retrieval-quality benchmark
        env:
          AGENT_MEMORY_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          PYTHONPATH=reference python reference/run_retrieval_quality_benchmark.py
          --agent-memory-revision "$AGENT_MEMORY_REVISION"
          --output retrieval-quality.json
      - name: Validate bounded benchmark evidence
        run: |
          python - <<'PY'
          import json
          r = json.load(open('retrieval-quality.json'))
          assert r['schema_version'] == '1.0.0'
          assert r['benchmark_id'] == 'agent-memory-rc-retrieval-quality'
          lexical = r['systems']['lexical_only']['aggregate']
          multi = r['systems']['multi_route']['aggregate']
          assert lexical['relevant_total'] == 7
          assert lexical['admitted_recall'] == 0.428571
          assert multi['admitted_recall'] == 1.0
          assert lexical['admitted_precision'] == 1.0
          assert multi['admitted_precision'] == 1.0
          assert r['governance']['lexical_forbidden_admission_failures'] == 0
          assert r['governance']['multi_route_forbidden_admission_failures'] == 0
          assert r['governance']['multi_route_forbidden_ranked_failures'] == 0
          assert r['governance']['route_authority_effect_violations'] == 0
          print({
              'lexical_admitted_recall': lexical['admitted_recall'],
              'multi_route_admitted_recall': multi['admitted_recall'],
              'multi_route_precision': multi['admitted_precision'],
              'candidate_amplification': r['comparison']['candidate_amplification'],
          })
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: rc-retrieval-quality
          path: retrieval-quality.json
          if-no-files-found: error
