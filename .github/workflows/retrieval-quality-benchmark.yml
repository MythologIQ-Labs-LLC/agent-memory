name: Retrieval Quality Benchmark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rc-retrieval-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install reference dependencies
        run: python -m pip install --disable-pip-version-check -r reference/requirements.txt
      - name: Run retrieval benchmark and regression tests
        run: |
          PYTHONPATH=reference python -m unittest discover -s reference/tests -t reference -p 'test_retrieval_quality_benchmark.py'
          PYTHONPATH=reference python -m unittest discover -s reference/tests -t reference -p 'test_continuous_retrieval_regression.py'
          PYTHONPATH=reference python -m unittest discover -s reference/tests -t reference -p 'test_swe_context_bench.py'
      - name: Execute continuous retrieval regression
        env:
          AGENT_MEMORY_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          PYTHONPATH=reference python reference/run_retrieval_quality_benchmark.py
          --agent-memory-revision "$AGENT_MEMORY_REVISION"
          --continuous-regression
          --output retrieval-quality.json
      - name: Execute SWE ContextBench RC evidence fixture
        env:
          AGENT_MEMORY_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          PYTHONPATH=reference python reference/run_swe_context_bench.py
          --manifest reference/fixtures/benchmarks/swe-context-bench/manifest.json
          --benchmark-root reference/fixtures/benchmarks/swe-context-bench
          --evidence-profile reference/fixtures/benchmarks/swe-context-bench-rc-profile-v1.json
          --agent-memory-revision "$AGENT_MEMORY_REVISION"
          --consistency-repeat-count 5
          --output swe-contextbench-rc-evidence.json
      - name: Validate bounded benchmark and regression evidence
        run: |
          python - <<'PY'
          import json
          r = json.load(open('retrieval-quality.json'))
          assert r['schema_version'] == '1.0.0'
          assert r['benchmark_id'] == 'agent-memory-rc-retrieval-quality'
          lexical = r['systems']['lexical_only']['aggregate']
          multi = r['systems']['multi_route']['aggregate']
          assert lexical['relevant_total'] == 7
          assert lexical['admitted_recall'] == 0.428571
          assert lexical['false_admission_count'] == 0
          assert lexical['false_refusal_count'] == 4
          assert multi['candidate_recall'] == 1.0
          assert multi['admitted_recall'] == 1.0
          assert lexical['admitted_precision'] == 1.0
          assert multi['admitted_precision'] == 1.0
          assert multi['admitted_f1'] == 1.0
          assert multi['false_admission_count'] == 0
          assert multi['false_refusal_count'] == 0
          assert r['metric_contract']['aggregate_health_score'] == 'not_defined'
          assert 'false_admission_count' in r['metric_contract']['final_governed_admission']
          assert 'false_refusal_count' in r['metric_contract']['final_governed_admission']
          refusal_counts = r['governance_evidence']['multi_route']['refusal_reason_counts']
          assert refusal_counts.get('required_isolation_domain_missing', 0) > 0
          assert refusal_counts.get('superseded_not_current', 0) > 0
          assert r['governance_evidence']['multi_route']['authority_effect'] == 'none'
          assert r['governance']['lexical_forbidden_admission_failures'] == 0
          assert r['governance']['multi_route_forbidden_admission_failures'] == 0
          assert r['governance']['multi_route_forbidden_ranked_failures'] == 0
          assert r['governance']['route_authority_effect_violations'] == 0
          regression = r['continuous_regression']
          assert regression['same_process_repeat_consistent'] is True
          assert regression['fresh_runtime_reconstruction_consistent'] is True
          assert regression['persisted_restart_exercised_by_this_runner'] is True
          persisted = regression['persisted_restart']
          assert persisted['profile'] == 'sqlite_lexical_exact_shared_evidence_v1'
          assert persisted['canonical_state_digest_consistent'] is True
          assert persisted['recall_result_consistent'] is True
          assert persisted['vector_persistence_claimed'] is False
          assert persisted['typed_graph_persistence_claimed'] is False
          assert persisted['authority_effect'] == 'none'
          assert regression['targets']['all_expectations_met'] is True
          checks = regression['targets']['checks']
          assert checks['candidate_recall']['passed'] is True
          assert checks['final_admitted_recall']['passed'] is True
          assert checks['final_admitted_precision']['passed'] is True
          assert checks['final_admitted_f1']['passed'] is True
          assert checks['governance_zero_violations']['passed'] is True
          historical = regression['historical_baselines'][0]
          assert historical['provenance_status'] == 'historical_metadata_only'
          assert historical['reported_metrics'] == {
              'recall': 1.0,
              'precision': 0.06,
              'f1': 0.1,
              'metric_layer': 'not_bound_in_source_context',
          }
          assert 'health_score' not in r
          assert 'memory_health_score' not in r
          print({
              'candidate_recall': multi['candidate_recall'],
              'final_recall': multi['admitted_recall'],
              'final_precision': multi['admitted_precision'],
              'final_f1': multi['admitted_f1'],
              'false_admissions': multi['false_admission_count'],
              'false_refusals': multi['false_refusal_count'],
              'candidate_amplification': r['comparison']['candidate_amplification'],
              'persisted_restart_profile': persisted['profile'],
          })
          PY
      - name: Validate SWE ContextBench RC evidence contract
        run: |
          python - <<'PY'
          import json
          r = json.load(open('swe-contextbench-rc-evidence.json'))
          assert r['schema_version'] == '1.1.0'
          assert r['benchmark_id'] == 'agent-memory-swe-context-bench-lite-retrieval'
          assert r['score_protocol'] == 'swe_context_bench_lite_gold_edge_retrieval_v1'
          assert r['corpus']['synthetic_fixture'] is True
          assert r['comparability']['external_reference_status'] == 'not-comparable-synthetic-fixture'
          assert r['claim_boundary']['synthetic_fixture_cannot_substitute_for_public_corpus'] is True
          quality = r['quality']
          assert quality['candidate_recall'] == 1.0
          assert quality['final_admitted_recall'] == 1.0
          assert 'final_admitted_precision' in quality
          assert 'final_admitted_f1' in quality
          assert 'false_admission_count' in quality
          assert 'false_refusal_count' in quality
          assert 'ndcg_at_1' in quality
          assert 'ndcg_at_3' in quality
          assert r['consistency']['repeat_count'] == 5
          assert r['consistency']['mean_pairwise_jaccard'] == 1.0
          assert r['consistency']['persisted_restart_claimed'] is False
          assert r['governance']['corpus_mutation_failures'] == 0
          assert r['governance']['route_authority_effect_violations'] == 0
          assert r['governance']['authority_effect'] == 'none'
          refs = r['benchmark_profile']['external_reference_results']
          assert refs['gpt_4_1_mini']['f1'] == 0.41
          assert refs['jev_bm25_k32']['precision'] == 0.89
          assert refs['jev_bm25_k32']['new_issue_cited_atom_jaccard'] == 0.98
          historical = r['benchmark_profile']['historical_agent_memory']
          assert historical['provenance_status'] == 'historical_metadata_only'
          assert historical['directly_comparable'] is False
          assert r['metric_contract']['aggregate_health_score'] == 'not_defined'
          assert 'health_score' not in r
          assert r['performance']['token_or_model_call_counts'] == 'not_exposed_by_this_runner'
          print({
              'candidate_recall': quality['candidate_recall'],
              'final_recall': quality['final_admitted_recall'],
              'final_precision': quality['final_admitted_precision'],
              'final_f1': quality['final_admitted_f1'],
              'consistency_jaccard': r['consistency']['mean_pairwise_jaccard'],
              'external_reference_status': r['comparability']['external_reference_status'],
          })
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: rc-retrieval-quality
          path: |
            retrieval-quality.json
            swe-contextbench-rc-evidence.json
          if-no-files-found: error
