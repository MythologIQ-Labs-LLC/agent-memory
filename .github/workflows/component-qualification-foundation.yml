name: Component Qualification Foundation

on:
  pull_request:
    paths:
      - "schemas/component-capability-qualification.schema.json"
      - "reference/agentmem_ref/qualification.py"
      - "reference/agentmem_ref/component_fallback.py"
      - "reference/agentmem_ref/component_failure_probe.py"
      - "reference/agentmem_ref/code_graph_qualification.py"
      - "reference/run_component_failure_probe.py"
      - "reference/run_component_qualification.py"
      - "reference/tests/test_component_qualification.py"
      - "reference/tests/test_component_fallback.py"
      - "reference/tests/test_component_failure_probe.py"
      - "reference/tests/test_code_graph_qualification.py"
      - "reference/fixtures/component-qualification/**"
      - ".github/workflows/component-qualification-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install reference dependencies
        run: python -m pip install --disable-pip-version-check -r reference/requirements.txt

      - name: Run qualification, failure, fallback, and normalizer tests
        env:
          PYTHONPATH: reference
        run: |
          python -m unittest \
            reference/tests/test_component_qualification.py \
            reference/tests/test_component_fallback.py \
            reference/tests/test_component_failure_probe.py \
            reference/tests/test_code_graph_qualification.py

      - name: Verify source mutation fixture is material
        run: |
          test reference/fixtures/component-qualification/v1/main.rs
          test reference/fixtures/component-qualification/v2/main.rs
          ! cmp -s \
            reference/fixtures/component-qualification/v1/main.rs \
            reference/fixtures/component-qualification/v2/main.rs

      - name: Verify adversarial line identities are stable
        run: |
          python - <<'PY'
          from pathlib import Path

          def line_of(path: str, prefix: str) -> int:
              lines = Path(path).read_text(encoding="utf-8").splitlines()
              return next(i for i, line in enumerate(lines, 1) if line.startswith(prefix))

          v1_main = "reference/fixtures/component-qualification/v1/main.rs"
          v1_decoy = "reference/fixtures/component-qualification/v1/decoy.rs"
          v2_main = "reference/fixtures/component-qualification/v2/main.rs"
          assert line_of(v1_main, "fn middle") == 5
          assert line_of(v1_decoy, "fn middle") == 5
          assert line_of(v2_main, "fn middle") == 5
          assert line_of(v1_main, "fn leaf") == 1
          assert line_of(v1_decoy, "fn decoy_leaf") == 12
          assert line_of(v2_main, "fn replacement_leaf") == 13
          PY
