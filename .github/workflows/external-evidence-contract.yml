name: External Evidence Contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  external-evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reference dependencies
        run: python -m pip install --disable-pip-version-check -r reference/requirements.txt

      - name: Validate schemas
        run: python scripts/validate_schemas.py

      - name: Run trust and transparency boundary tests
        env:
          PYTHONPATH: reference
        run: |
          python -m unittest \
            reference/tests/test_temporal_trust.py \
            reference/tests/test_temporal_transparency.py

      - name: Run pinned external comparator
        env:
          AGENT_MEMORY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python reference/run_rfc3161_comparator.py \
            --provision-release \
            --agent-memory-commit "$AGENT_MEMORY_COMMIT" \
            --output external-trust-evidence.json

      - name: Upload external evidence
        uses: actions/upload-artifact@v4
        with:
          name: external-trust-evidence
          path: external-trust-evidence.json
          if-no-files-found: error
