name: Semantic Representation

# #669: exercise the pinned ONNX representation provider for real. Model-dependent
# tests skip elsewhere; here AGENT_MEMORY_REQUIRE_REPRESENTATION=1 turns any skip
# into a failure, so the provider, the derived store and the facade route are
# qualified on every PR that touches the semantic route (#662: path-scoped, no
# push trigger), and on deliberate workflow_dispatch at an exact SHA.

on:
  pull_request:
    paths:
      - 'reference/agentmem_ref/runtime/representation_onnx.py'
      - 'reference/agentmem_ref/runtime/representation_cache.py'
      - 'reference/agentmem_ref/runtime/vector_retrieval.py'
      - 'reference/agentmem_ref/runtime/semantic_readmission_adapter.py'
      - 'reference/requirements-semantic.txt'
      - 'reference/tests/test_representation_onnx.py'
      - 'reference/tests/test_representation_cache.py'
      - 'reference/tests/test_semantic_route_policy_320.py'
      - 'reference/tests/test_native_vector_retrieval.py'
      - 'reference/tests/test_facade_recall_control.py'
      - '.github/workflows/semantic-representation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  semantic-representation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENT_MEMORY_REPRESENTATION_DIR: ${{ github.workspace }}/.representation/multi-qa-MiniLM-L6-cos-v1-b207367
      AGENT_MEMORY_REQUIRE_REPRESENTATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install reference and semantic dependencies
        run: |
          python -m pip install --disable-pip-version-check -r reference/requirements.txt
          python -m pip install --disable-pip-version-check -r reference/requirements-semantic.txt
      - name: Restore pinned model
        uses: actions/cache@v4
        with:
          path: .representation
          key: semantic-minilm-b207367-${{ hashFiles('reference/agentmem_ref/runtime/representation_onnx.py') }}
      - name: Fetch and verify the pinned model by digest
        run: PYTHONPATH=reference python -m agentmem_ref.runtime.representation_onnx fetch
      - name: Run provider, store, policy and facade tests (skips fail)
        run: |
          PYTHONPATH=reference python -m unittest discover -s reference/tests -t reference -p 'test_representation_onnx.py'
          PYTHONPATH=reference python -m unittest discover -s reference/tests -t reference -p 'test_representation_cache.py'
          PYTHONPATH=reference python -m unittest discover -s reference/tests -t reference -p 'test_semantic_route_policy_320.py'
          PYTHONPATH=reference python -m unittest discover -s reference/tests -t reference -p 'test_native_vector_retrieval.py'
          PYTHONPATH=reference python -m unittest discover -s reference/tests -t reference -p 'test_facade_recall_control.py'
