name: Gauntlet Durability Recovery

on:
  pull_request:
    paths:
      - 'examples/gauntlet/agent_memory_durability_stdio.py'
      - 'fixtures/gauntlet/agent-memory-public-durability-adapter.json'
      - 'fixtures/gauntlet/durability-lossy-recovery-adapter.json'
      - 'reference/agentmem_ref/evaluation/gauntlet_agent_memory_durability.py'
      - 'reference/agentmem_ref/evaluation/gauntlet_durability.py'
      - 'reference/agentmem_ref/evaluation/gauntlet_durability_fixtures.py'
      - 'reference/agentmem_ref/evaluation/gauntlet_profiles.py'
      - 'reference/tests/test_gauntlet_durability.py'
      - 'reports/runtime/baseline-register.json'
      - 'scripts/check_runtime_baseline_equivalence.py'
      - '.github/workflows/gauntlet-durability-recovery.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  durability-recovery-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install package and test dependency
        run: python -m pip install -e . pytest

      - name: Classify the candidate against the current Runtime Baseline
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          out="$(python scripts/check_runtime_baseline_equivalence.py --candidate HEAD)"
          echo "$out"
          state="$(echo "$out" | grep -oE 'equivalence: [A-Z]+' | head -n1 | cut -d' ' -f2)"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Read the current baseline from the register
        id: current
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          register = json.loads(Path("reports/runtime/baseline-register.json").read_text(encoding="utf-8"))
          entry = register["baselines"][-1]
          boundary = json.loads(Path(entry["source_boundary"]).read_text(encoding="utf-8"))
          print(f"baseline_id={entry['baseline_id']}")
          print(f"revision={boundary['frozen_revision']}")
          PY

      - name: Classify the contestant against the register
        id: contestant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          register = json.loads(Path("reports/runtime/baseline-register.json").read_text(encoding="utf-8"))
          entries = register["baselines"]
          revisions = {}
          for item in entries:
              boundary = json.loads(Path(item["source_boundary"]).read_text(encoding="utf-8"))
              revisions[boundary["frozen_revision"]] = item["baseline_id"]
          current = entries[-1]["baseline_id"]
          pinned = json.loads(Path("fixtures/gauntlet/agent-memory-public-durability-adapter.json").read_text(encoding="utf-8"))["system"]["revision"].removeprefix("git-commit:")
          if pinned == next(rev for rev, bid in revisions.items() if bid == current):
              print("contestant=current")
          elif pinned in revisions:
              print("contestant=retired")
              print(f"contestant_baseline={revisions[pinned]}")
          else:
              raise SystemExit(f"contestant pins {pinned}, which is no Runtime Baseline in the register")
          print(f"contestant_revision={pinned}")
          PY

      - name: Transition notice
        if: steps.classify.outputs.state == 'TRANSITION'
        run: |
          echo "The register declares a successor and the candidate is in a pinned transition."
          echo "The public durability contestant is not run: no evidence may claim ${{ steps.current.outputs.revision }} from this checkout."

      - name: Retired contestant notice
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'retired'
        run: |
          echo "The public durability contestant fixtures/gauntlet/agent-memory-public-durability-adapter.json is retired: it pins a predecessor Runtime Baseline, so the durability contestant is not run from this checkout."
          echo "It pins ${{ steps.contestant.outputs.contestant_revision }} (${{ steps.contestant.outputs.contestant_baseline }}); the current Runtime Baseline is ${{ steps.current.outputs.revision }} (${{ steps.current.outputs.baseline_id }})."
          echo "Re-pinning it to the successor is a later two-step of its own (docs/67 Step B1); nothing here claims the current revision."

      - name: Verify exact Agent Memory durability adapter identity
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER_REVISION="git-blob:$(git hash-object reference/agentmem_ref/evaluation/gauntlet_agent_memory_durability.py)"
          GOVERNANCE_REVISION="$(git hash-object reference/agentmem_ref/evaluation/gauntlet_agent_memory.py)"
          WRAPPER_REVISION="git-blob:$(git hash-object examples/gauntlet/agent_memory_durability_stdio.py)"
          python - "$ADAPTER_REVISION" "$GOVERNANCE_REVISION" "$WRAPPER_REVISION" "${{ steps.current.outputs.revision }}" <<'PY'
          import json
          import sys
          from pathlib import Path

          adapter_revision, governance_revision, wrapper_revision, baseline_revision = sys.argv[1:5]
          manifest = json.loads(Path("fixtures/gauntlet/agent-memory-public-durability-adapter.json").read_text(encoding="utf-8"))
          assert manifest["adapter"]["revision"] == adapter_revision, (manifest["adapter"]["revision"], adapter_revision)
          assert governance_revision == "2cfac37156add666c4494211ef861f6ba10af7c6", governance_revision
          assert manifest["metadata"]["transport_wrapper_revision"] == wrapper_revision, (manifest["metadata"]["transport_wrapper_revision"], wrapper_revision)
          assert manifest["system"]["revision"] == f"git-commit:{baseline_revision}", (manifest["system"]["revision"], baseline_revision)
          assert manifest["transport"]["kind"] == "stdio"
          assert manifest["capabilities"]["checkpoint"]["support"] == "unsupported"
          assert manifest["capabilities"]["durable_correction"]["support"] == "unsupported"
          print(f"exact durability adapter revision: {adapter_revision}")
          print(f"preserved governance adapter blob: {governance_revision}")
          print(f"exact durability transport revision: {wrapper_revision}")
          PY

      - name: Run focused evaluator and real-contestant tests
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        run: python -m pytest -q reference/tests/test_gauntlet_durability.py

      - name: Validate public durability contestant
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        run: agent-memory gauntlet validate-adapter fixtures/gauntlet/agent-memory-public-durability-adapter.json

      - name: Inspect durability recovery profile
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        run: agent-memory gauntlet inspect durability-recovery-alpha-v1

      - name: Run public-facade durability qualification
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        run: |
          agent-memory gauntlet run \
            --system fixtures/gauntlet/agent-memory-public-durability-adapter.json \
            --profile durability-recovery-alpha-v1 \
            --allow-external-process \
            --allow-destructive-operations \
            --output-dir ./durability-runs

      - name: Validate generated native evidence
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$(find durability-runs -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$RUN_DIR"
          python - "$RUN_DIR/native-results.json" "$RUN_DIR/normalized-run.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          native = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          normalized = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          cases = {case["case_id"]: case for case in native["cases"]}
          expected_pass = {"DUR-REC-001", "DUR-DEL-001", "DUR-DET-001", "DUR-ISO-001"}
          expected_unsupported = {"DUR-COR-001", "DUR-CHK-001"}
          assert set(cases) == expected_pass | expected_unsupported, sorted(cases)
          for case_id in expected_pass:
              assert cases[case_id]["behavioral_outcome"] == "pass", cases[case_id]
              assert cases[case_id]["evidence_qualification"] == "sufficient", cases[case_id]
              for key in ("pre_state", "transition", "expected_boundary", "post_state"):
                  assert key in cases[case_id], (case_id, key)
          for case_id in expected_unsupported:
              assert cases[case_id]["behavioral_outcome"] == "unsupported", cases[case_id]
              assert cases[case_id]["evidence_qualification"] == "sufficient", cases[case_id]
              assert cases[case_id]["transition"]["operation_executed"] is False, cases[case_id]
          assert normalized["authority_effect"] == "none"
          assert normalized["dimensions"]["governance"]["status"] == "partial"
          assert normalized["dimensions"]["evaluator_integrity"]["status"] == "measured"
          print("durability recovery alpha evidence validated")
          PY

      - name: Inventory qualification evidence
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p durability-evidence
          find durability-runs -type f -print | sort | tee durability-evidence/files.txt
          while IFS= read -r file; do sha256sum "$file"; done < durability-evidence/files.txt | tee durability-evidence/sha256.txt
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "profile=durability-recovery-alpha-v1"
            echo "manifest=fixtures/gauntlet/agent-memory-public-durability-adapter.json"
            python --version
          } | tee durability-evidence/source-environment.txt

      - name: Upload durability qualification evidence
        if: steps.classify.outputs.state == 'PASS' && steps.contestant.outputs.contestant == 'current'
        uses: actions/upload-artifact@v7
        with:
          name: gauntlet-durability-recovery-alpha-v1
          path: |
            durability-runs/
            durability-evidence/
          if-no-files-found: error
          retention-days: 90
