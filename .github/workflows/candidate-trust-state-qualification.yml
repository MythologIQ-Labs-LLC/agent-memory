name: Candidate Trust State Qualification

# #757: fast, targeted evidence against the single-checkpoint revocation and
# issuer/source-witness composition. Does not authorize any runtime baseline.
on:
  pull_request:
    paths:
      - 'reference/agentmem_ref/evaluation/candidate_*.py'
      - 'reference/agentmem_ref/evaluation/issuer_policy*.py'
      - 'reference/agentmem_ref/evaluation/source_actor_witnesses.py'
      - 'reference/agentmem_ref/evaluation/property_registry.py'
      - 'reference/tests/test_candidate_trust_state.py'
      - 'reference/tests/test_issuer_policy*.py'
      - 'reference/tests/test_source_actor_witnesses.py'
      - 'reference/tests/test_property_registry.py'
      - 'reference/tests/test_proposition_link_preflight.py'
      - '.github/workflows/candidate-trust-state-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install reference dependencies
        run: python -m pip install --disable-pip-version-check -r reference/requirements.txt
      - name: Execute exact candidate-trust and upstream identity tests
        env:
          PYTHONPATH: reference
        run: |
          set -euo pipefail
          python -m unittest discover -s reference/tests -t reference -p 'test_candidate_trust_state.py' -v
          python -m unittest discover -s reference/tests -t reference -p 'test_issuer_policy*.py' -v
          python -m unittest discover -s reference/tests -t reference -p 'test_source_actor_witnesses.py' -v
          python -m unittest discover -s reference/tests -t reference -p 'test_property_registry.py' -v
          python -m unittest discover -s reference/tests -t reference -p 'test_proposition_link_preflight.py' -v
